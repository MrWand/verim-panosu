const SHIFT_BLOCKS = [
  { start: '06:55', end: '09:30' },
  { start: '09:45', end: '12:00' },
  { start: '12:50', end: '15:15' },
  { start: '15:30', end: '16:55' },
];
const OVERTIME_BLOCK = { start: '17:25', end: '20:00' };
const ALL_BLOCKS = [...SHIFT_BLOCKS, OVERTIME_BLOCK];

function timeToMin(t) { if (!t) return null; const parts = t.split(':'); if (parts.length < 2) return null; const h = parseInt(parts[0], 10), m = parseInt(parts[1], 10); if (isNaN(h) || isNaN(m)) return null; return h * 60 + m; }
function minToTime(m) { if (m == null || isNaN(m)) return '—'; m = Math.round(m); const h = Math.floor(m / 60), mm = m % 60; return `${String(h).padStart(2, '0')}:${String(mm).padStart(2, '0')}`; }
const SHIFT_START_MIN = timeToMin(SHIFT_BLOCKS[0].start);
const SHIFT_END_MIN = timeToMin(SHIFT_BLOCKS[SHIFT_BLOCKS.length - 1].end);
const OT_END_MIN = timeToMin(OVERTIME_BLOCK.end);
const NET_SHIFT_MIN = SHIFT_BLOCKS.reduce((acc, b) => acc + (timeToMin(b.end) - timeToMin(b.start)), 0);

function estimateFinishTime(startMin, workMinutesNeeded, blocks) {
  blocks = blocks || SHIFT_BLOCKS;
  if (startMin == null || workMinutesNeeded == null || workMinutesNeeded <= 0) return { finishMin: startMin, overflow: false };
  let remaining = workMinutesNeeded;
  const lastBlockEnd = timeToMin(blocks[blocks.length - 1].end);
  for (const block of blocks) {
    const bStart = timeToMin(block.start), bEnd = timeToMin(block.end);
    if (bEnd <= startMin) continue;
    const segStart = Math.max(bStart, startMin);
    const segAvail = bEnd - segStart;
    if (segAvail <= 0) continue;
    if (remaining <= segAvail) return { finishMin: segStart + remaining, overflow: false };
    remaining -= segAvail;
  }
  return { finishMin: lastBlockEnd + remaining, overflow: true };
}

function estimateWithDecision(startMin, workMinutesNeeded, decision, dayIdx = 0) {
  const normal = estimateFinishTime(startMin, workMinutesNeeded, SHIFT_BLOCKS);
  if (!normal.overflow) return { finishMin: normal.finishMin, mode: 'normal', needsDecision: false, label: minToTime(normal.finishMin) };
  
  if (dayIdx === 4) {
    if (decision === 'yes' || decision === 'friday_ot') {
      const withOT = estimateFinishTime(startMin, workMinutesNeeded, ALL_BLOCKS);
      if (!withOT.overflow) {
        return { finishMin: withOT.finishMin, mode: 'overtime', needsDecision: false, label: `${minToTime(withOT.finishMin)} (Cuma Mesai)` };
      }
      const remSat = withOT.finishMin - OT_END_MIN;
      const satEst = estimateFinishTime(SHIFT_START_MIN, remSat, SHIFT_BLOCKS);
      if (!satEst.overflow) {
        return { finishMin: satEst.finishMin, mode: 'weekend_sat', needsDecision: false, label: `↷ Cmt ${minToTime(satEst.finishMin)}` };
      }
      const remSun = satEst.finishMin - SHIFT_END_MIN;
      const sunEst = estimateFinishTime(SHIFT_START_MIN, remSun, SHIFT_BLOCKS);
      return { finishMin: sunEst.finishMin, mode: 'weekend_sun', needsDecision: false, label: `↷ Paz ${minToTime(sunEst.finishMin)}` };
    }
    if (decision === 'sat_only') {
      const fridayWorkDone = workMinutesBetween(startMin, SHIFT_END_MIN, SHIFT_BLOCKS);
      const remSat = workMinutesNeeded - fridayWorkDone;
      const satEst = estimateFinishTime(SHIFT_START_MIN, remSat, SHIFT_BLOCKS);
      if (!satEst.overflow) {
        return { finishMin: satEst.finishMin, mode: 'weekend_sat', needsDecision: false, label: `↷ Cmt ${minToTime(satEst.finishMin)}` };
      }
      const remSun = satEst.finishMin - SHIFT_END_MIN;
      const sunEst = estimateFinishTime(SHIFT_START_MIN, remSun, SHIFT_BLOCKS);
      return { finishMin: sunEst.finishMin, mode: 'weekend_sun', needsDecision: false, label: `↷ Paz ${minToTime(sunEst.finishMin)}` };
    }
    if (decision === 'no') {
      return { finishMin: normal.finishMin, mode: 'carryover', needsDecision: false, label: '↷ Pzt Devir' };
    }
    return { finishMin: normal.finishMin, mode: 'pending_friday', needsDecision: true, label: '? Karar Bekliyor' };
  }

  if (decision === 'yes') {
    const withOT = estimateFinishTime(startMin, workMinutesNeeded, ALL_BLOCKS);
    if (!withOT.overflow) return { finishMin: withOT.finishMin, mode: 'overtime', needsDecision: false, label: minToTime(withOT.finishMin) };
    return { finishMin: withOT.finishMin, mode: 'exceeds', overMinutes: withOT.finishMin - OT_END_MIN, needsDecision: false, label: '> 20:00 (Aşım)' };
  }
  if (decision === 'no') {
    return { finishMin: normal.finishMin, mode: 'carryover', needsDecision: false, label: '↷ Devir' };
  }
  return { finishMin: normal.finishMin, mode: 'pending', needsDecision: true, label: '? Karar Bekliyor' };
}

function stageRequiredMinutes(standardHours, presentStaff) {
  if (standardHours == null || !presentStaff || presentStaff <= 0) return null;
  return (standardHours * 60) / presentStaff;
}

function workMinutesBetween(startMin, endMin, blocks) {
  blocks = blocks || ALL_BLOCKS;
  if (startMin == null || endMin == null || endMin <= startMin) return 0;
  let total = 0;
  blocks.forEach((block) => {
    const bStart = timeToMin(block.start), bEnd = timeToMin(block.end);
    const segStart = Math.max(bStart, startMin);
    const segEnd = Math.min(bEnd, endMin);
    if (segEnd > segStart) total += segEnd - segStart;
  });
  return total;
}

function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = date.getDate() - day + (day === 0 ? -6 : 1);
  date.setDate(diff);
  date.setHours(0, 0, 0, 0);
  return date;
}
function addDays(d, n) { const nd = new Date(d); nd.setDate(nd.getDate() + n); return nd; }
function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function formatRange(monday) {
  const sunday = addDays(monday, 6);
  if (monday.getMonth() === sunday.getMonth()) {
    return `${monday.getDate()}–${sunday.getDate()} ${MONTHS[monday.getMonth()]} ${monday.getFullYear()}`;
  }
  return `${monday.getDate()} ${MONTHS[monday.getMonth()]} – ${sunday.getDate()} ${MONTHS[sunday.getMonth()]} ${sunday.getFullYear()}`;
}

function calcEff(totalActual, totalStandard) {
  if (totalActual == null || totalStandard == null || totalActual <= 0 || totalStandard <= 0) return null;
  return Math.min((totalStandard / totalActual) * 100, 999);
}

function effColor(eff, C) {
  if (eff === null) return C.dim;
  if (eff >= 90) return C.good;
  if (eff >= 70) return C.copper;
  return C.bad;
}

}

// ADIM 4: YÖNETİCİ GRAFİKLERİ VE KPI BİLEŞENLERİ (SVG REAKTİF)
function TrendChart({ weekDates, data, carryoverMap, stations }) {
  const { C } = useTheme();

  // Her gün için ortalama verim hesaplama
  const dailyEffs = useMemo(() => {
    return weekDates.map((d, i) => {
      let sum = 0, count = 0;
      stations.filter(s => s.active !== false).forEach(s => {
        const e = data.entries[`${dateKey(d)}|${s.id}`];
        if (!e || e.isIdle) return;
        const act = (parseFloat(e.actual) || 0) + (e.hasSecondJob ? (parseFloat(e.secondJobActual) || 0) : 0);
        const cInfo = carryoverMap[s.id]?.[i];
        const std = cInfo ? cInfo.totalStandard : s.standardHours;
        const eff = calcEff(act, std);
        if (eff !== null) { sum += eff; count += 1; }
      });
      return count > 0 ? Math.round(sum / count) : 0;
    });
  }, [weekDates, data, carryoverMap, stations]);

  const maxVal = Math.max(120, ...dailyEffs);
  const chartHeight = 160;

  return (
    <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: 18, boxShadow: C.cardShadow }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
        <span style={{ fontSize: 13, fontWeight: 700, color: C.paper }}>📈 Günlük Verim Trendi (%)</span>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, fontSize: 11, color: C.dim }}>
          <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}><span style={{ width: 10, height: 10, background: C.line, borderRadius: 2 }} /> Gerçekleşen</span>
          <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}><span style={{ width: 10, height: 2, background: C.good }} /> %100 Hedef</span>
        </div>
      </div>

      <svg width="100%" height={chartHeight} viewBox={`0 0 500 ${chartHeight}`} style={{ overflow: 'visible' }}>
        {/* Kılavuz Çizgileri */}
        <line x1="40" y1="30" x2="490" y2="30" stroke={C.chartGrid} strokeDasharray="3 3" />
        <text x="32" y="34" fill={C.chartText} fontSize="10" textAnchor="end">100%</text>

        <line x1="40" y1="85" x2="490" y2="85" stroke={C.chartGrid} strokeDasharray="3 3" />
        <text x="32" y="89" fill={C.chartText} fontSize="10" textAnchor="end">50%</text>

        <line x1="40" y1="135" x2="490" y2="135" stroke={C.border} />
        <text x="32" y="139" fill={C.chartText} fontSize="10" textAnchor="end">0%</text>

        {/* 100% Hedef Çizgisi */}
        {(() => {
          const targetY = 135 - (100 / maxVal) * 105;
          return <line x1="40" y1={targetY} x2="490" y2={targetY} stroke={C.good} strokeWidth="1.5" strokeDasharray="4 4" />;
        })()}

        {/* Çubuklar */}
        {dailyEffs.map((val, idx) => {
          const x = 70 + idx * 60;
          const barHeight = val > 0 ? (val / maxVal) * 105 : 2;
          const y = 135 - barHeight;
          const barColor = val >= 90 ? C.good : (val >= 70 ? C.copper : (val > 0 ? C.bad : C.dim));

          return (
            <g key={idx}>
              <rect x={x - 16} y={y} width="32" height={barHeight} rx="4" fill={barColor} opacity="0.88" />
              <text x={x} y={y - 5} fill={C.paper} fontSize="11" fontWeight="700" textAnchor="middle">
                {val > 0 ? `${val}%` : '—'}
              </text>
              <text x={x} y="152" fill={C.dim} fontSize="11" fontWeight="600" textAnchor="middle">
                {DAY_NAMES[idx]}
              </text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function App({ currentUser, onLogout }) {
  const { theme, toggleTheme, C } = useTheme();
  const [data, setData] = useState({ stations: [], entries: {}, settings: { allowancePercent: 10 } });
  const [connected, setConnected] = useState(true);
  const [weekStart, setWeekStart] = useState(() => getMonday(new Date()));
  const [dayIndex, setDayIndex] = useState(() => { const d = new Date().getDay(); return d === 0 ? 6 : d - 1; });
  const [newStation, setNewStation] = useState('');
  const [newGroup, setNewGroup] = useState('kaynakmontaj');
  const [newStandard, setNewStandard] = useState('');
  const [showInactiveStations, setShowInactiveStations] = useState(false);
  const [showWeekendModal, setShowWeekendModal] = useState(false);
  const [lastEdit, setLastEdit] = useState(null);
  
  // YENİ ÖZELLİKLER İÇİN DURUM (STATE) DEĞİŞKENLERİ
  const [mainView, setMainView] = useState('dashboard'); // 'dashboard' | 'wagons' | 'analytics'
  const [selectedWagonDetail, setSelectedWagonDetail] = useState(null);
  const [wagonSearchQuery, setWagonSearchQuery] = useState('');
  const [wagonStatusFilter, setWagonStatusFilter] = useState('all'); // 'all' | 'in_progress' | 'completed'
  
  const pendingWrites = useRef({});
  const username = currentUser?.displayName || currentUser?.email || 'Bilinmeyen';

  function recordActivity() {
    db.collection('meta').doc('lastEdit').set({ username, timestamp: Date.now() }).catch(() => {});
  }

  useEffect(() => {
    const unsubLastEdit = db.collection('meta').doc('lastEdit').onSnapshot((doc) => {
      setLastEdit(doc.exists ? doc.data() : null);
    }, () => {});
    return () => unsubLastEdit();
  }, []);

  useEffect(() => {
    const onOnline = () => setConnected(true);
    const onOffline = () => setConnected(false);
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    setConnected(navigator.onLine);

    let seededEmpty = false;

    const unsubStations = db.collection('stations').onSnapshot((snap) => {
      let stations = snap.docs.map((d) => ({ id: d.id, active: d.data().active !== false, ...d.data() }));
      const oldFinal = stations.find((s) => s.name && s.name.trim().toLowerCase() === 'final temizlik');
      if (oldFinal) {
        db.collection('stations').doc(oldFinal.id).delete().catch(() => {});
        stations = stations.filter((s) => s.id !== oldFinal.id);
      }
      if (!seededEmpty && stations.length === 0) {
        seededEmpty = true;
        const batch = db.batch();
        DEFAULT_STATIONS.forEach((d, i) => {
          const id = 'seed_' + Date.now().toString(36) + '_' + i;
          batch.set(db.collection('stations').doc(id), { name: d.name, group: d.group, standardHours: d.standardHours, active: true });
        });
        batch.commit().catch((e) => console.error('Tohumlama hatası', e));
      } else if (stations.length > 0) {
        const existingNames = new Set(stations.map((s) => s.name.trim().toLowerCase()));
        DEFAULT_STATIONS.filter((d) => !existingNames.has(d.name.trim().toLowerCase())).forEach((d, i) => {
          const id = 'seed_' + Date.now().toString(36) + '_' + i;
          db.collection('stations').doc(id).set({ name: d.name, group: d.group, standardHours: d.standardHours, active: true }).catch(() => {});
        });
      }
      setData((prev) => ({ ...prev, stations }));
    }, (err) => { console.error('İstasyon senkron hatası', err); setConnected(false); });

    const unsubEntries = db.collection('entries').onSnapshot((snap) => {
      const entries = {};
      snap.docs.forEach((d) => { entries[d.id] = d.data(); });
      setData((prev) => ({ ...prev, entries }));
    }, (err) => { console.error('Giriş senkron hatası', err); setConnected(false); });

    const unsubSettings = db.collection('settings').doc('global').onSnapshot((doc) => {
      const settings = doc.exists ? doc.data() : { allowancePercent: 10 };
      if (!doc.exists) db.collection('settings').doc('global').set({ allowancePercent: 10 }).catch(() => {});
      setData((prev) => ({ ...prev, settings }));
    }, (err) => { console.error('Ayar senkron hatası', err); setConnected(false); });

    return () => { window.removeEventListener('online', onOnline); window.removeEventListener('offline', onOffline); unsubStations(); unsubEntries(); unsubSettings(); };
  }, []);

  function scheduleWrite(collectionName, docId, patch) {
    const key = `${collectionName}/${docId}`;
    const existing = pendingWrites.current[key] || { data: {} };
    existing.data = { ...existing.data, ...patch };
    if (existing.timer) clearTimeout(existing.timer);
    existing.timer = setTimeout(() => {
      const toWrite = pendingWrites.current[key]?.data;
      delete pendingWrites.current[key];
      db.collection(collectionName).doc(docId).set(toWrite, { merge: true }).then(() => recordActivity()).catch((e) => console.error('Yazma hatası', e));
    }, 450);
    pendingWrites.current[key] = existing;
  }

  const shiftHours = NET_SHIFT_MIN / 60;
  const allowancePercent = parseFloat(data.settings?.allowancePercent) || 0;
  const weekDates = useMemo(() => Array.from({ length: 7 }, (_, i) => addDays(weekStart, i)), [weekStart]);
  const selectedDate = weekDates[dayIndex];
  const selectedKey = dateKey(selectedDate);
  const isWeekendDay = dayIndex === 5 || dayIndex === 6;

  function updateSettings(field, value) {
    setData((prev) => ({ ...prev, settings: { ...prev.settings, [field]: value } }));
    scheduleWrite('settings', 'global', { [field]: value });
  }
  
  function addStation() {
    const name = newStation.trim();
    if (!name) return;
    const id = 'st_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const st = { id, name, group: newGroup, standardHours: newStandard === '' ? null : parseFloat(newStandard), active: true };
    setData((prev) => ({ ...prev, stations: [...prev.stations, st] }));
    db.collection('stations').doc(id).set({ name: st.name, group: st.group, standardHours: st.standardHours, active: true }).then(() => recordActivity()).catch((e) => console.error('Yazma hatası', e));
    setNewStation(''); setNewStandard('');
  }

  function toggleStationActive(id, currentStatus) {
    const newStatus = !currentStatus;
    setData((prev) => ({
      ...prev,
      stations: prev.stations.map((s) => s.id === id ? { ...s, active: newStatus } : s)
    }));
    scheduleWrite('stations', id, { active: newStatus });
  }

  function removeStation(id) {
    if (!confirm('Bu istasyonu tamamen silmek istediğinizden emin misiniz?')) return;
    setData((prev) => {
      const entries = { ...prev.entries };
      Object.keys(entries).forEach((k) => { if (k.endsWith('|' + id)) delete entries[k]; });
      return { stations: prev.stations.filter((s) => s.id !== id), entries, settings: prev.settings };
    });
    db.collection('stations').doc(id).delete().then(() => recordActivity()).catch((e) => console.error('Silme hatası', e));
    Object.keys(data.entries).forEach((k) => {
      if (k.endsWith('|' + id)) db.collection('entries').doc(k).delete().catch(() => {});
    });
  }

  function updateStationField(id, field, value) {
    setData((prev) => ({ ...prev, stations: prev.stations.map((s) => s.id === id ? { ...s, [field]: value } : s) }));
    scheduleWrite('stations', id, { [field]: value });
  }

  function updateEntry(dKey, stationId, field, value) {
    const key = `${dKey}|${stationId}`;
    const current = data.entries[key] || {};
    const merged = { ...current, [field]: value };
    const patch = { [field]: value };
    
    const totalStaff = parseFloat(merged.totalStaff) || 0;
    const absentStaff = parseFloat(merged.absentStaff) || 0;
    const present = Math.max(totalStaff - absentStaff, 0);

    // 1. İş gerçekleşen a-s
    if (merged.actualEndTime && !merged.isIdle) {
      const startMin = timeToMin(merged.startTime) ?? SHIFT_START_MIN;
      const endMin = timeToMin(merged.actualEndTime);
      if (endMin != null && present > 0) {
        const workMin = workMinutesBetween(startMin, endMin, ALL_BLOCKS);
        patch.actual = Math.round(((workMin * present) / 60) * 100) / 100;
      }
    } else if (field === 'actualEndTime' && !value) {
      patch.actual = '';
    }

    // 2. İş gerçekleşen a-s
    if (merged.hasSecondJob && merged.secondJobActualEndTime && !merged.isIdle) {
      const startMin2 = timeToMin(merged.secondJobStartTime) ?? (timeToMin(merged.actualEndTime) || SHIFT_START_MIN);
      const endMin2 = timeToMin(merged.secondJobActualEndTime);
      if (endMin2 != null && present > 0) {
        const workMin2 = workMinutesBetween(startMin2, endMin2, ALL_BLOCKS);
        patch.secondJobActual = Math.round(((workMin2 * present) / 60) * 100) / 100;
      }
    } else if (field === 'secondJobActualEndTime' && !value) {
      patch.secondJobActual = '';
    }
    
    setData((prev) => {
      const entries = { ...prev.entries };
      entries[key] = { ...(entries[key] || {}), ...patch };
      return { ...prev, entries };
    });
    scheduleWrite('entries', key, patch);
  }

  function toggleSecondJob(dKey, stationId, defaultStart, defaultStandard) {
    const key = `${dKey}|${stationId}`;
    const current = data.entries[key] || {};
    const hasSecond = !current.hasSecondJob;
    const patch = { 
      hasSecondJob: hasSecond,
      secondJobWagonNo: hasSecond ? (current.secondJobWagonNo || current.wagonNo || '') : '',
      secondJobStartTime: hasSecond ? (current.actualEndTime || defaultStart || '12:50') : '',
      secondJobStandard: hasSecond ? (current.secondJobStandard || defaultStandard || '') : '',
      secondJobActualEndTime: hasSecond ? (current.secondJobActualEndTime || '') : '',
      secondJobActual: hasSecond ? (current.secondJobActual || '') : '',
      secondJobStatus: 'completed'
    };
    setData((prev) => {
      const entries = { ...prev.entries };
      entries[key] = { ...(entries[key] || {}), ...patch };
      return { ...prev, entries };
    });
    scheduleWrite('entries', key, patch);
  }

  function toggleDayIdle(dKey, stationId) {
    const key = `${dKey}|${stationId}`;
    const current = data.entries[key] || {};
    const newIdle = !current.isIdle;
    const patch = { isIdle: newIdle };
    if (newIdle) {
      patch.actual = '';
      patch.startTime = '';
      patch.actualEndTime = '';
      patch.secondJobActual = '';
      patch.secondJobActualEndTime = '';
    }
    setData((prev) => {
      const entries = { ...prev.entries };
      entries[key] = { ...(entries[key] || {}), ...patch };
      return { ...prev, entries };
    });
    scheduleWrite('entries', key, patch);
  }

  function resetStationDayData(dKey, stationId, stationName) {
    if (!confirm(`${stationName} istasyonunun bu güne ait tüm verilerini sıfırlamak istediğinize emin misiniz?`)) return;
    const key = `${dKey}|${stationId}`;
    const updatedEntries = { ...data.entries };
    delete updatedEntries[key];
    setData((prev) => ({ ...prev, entries: updatedEntries }));
    db.collection('entries').doc(key).delete().then(() => recordActivity()).catch((e) => console.error('İstasyon sıfırlama hatası', e));
  }

  function resetDayData() {
    const dayLabel = `${DAY_NAMES[dayIndex]} ${selectedDate.getDate()} ${MONTHS[selectedDate.getMonth()]}`;
    if (!confirm(`${dayLabel} gününe ait TÜM istasyon verilerini sıfırlamak istediğinize emin misiniz? Bu işlem geri alınamaz.`)) return;

    const batch = db.batch();
    const updatedEntries = { ...data.entries };

    data.stations.forEach((s) => {
      const key = `${selectedKey}|${s.id}`;
      if (updatedEntries[key]) {
        delete updatedEntries[key];
        batch.delete(db.collection('entries').doc(key));
      }
    });

    setData((prev) => ({ ...prev, entries: updatedEntries }));
    batch.commit().then(() => recordActivity()).catch((e) => console.error('Sıfırlama hatası', e));
  }

  function hasDataForDate(d) {
    const k = dateKey(d);
    return data.stations.some((s) => hasAnyInput(data.entries[`${k}|${s.id}`]));
  }

  const carryoverMap = useMemo(() => {
    const map = {};
    data.stations.forEach((s) => {
      let carry = null;
      let carryWagon = null;
      const days = weekDates.map((d) => {
        const e = data.entries[`${dateKey(d)}|${s.id}`];
        const hasInput = hasAnyInput(e);
        const isIdle = !!e?.isIdle;

        if (!hasInput || isIdle) {
          const result = {
            baseCarry: carry,
            carryWagon,
            job1WagonNo: carryWagon || '',
            job1Standard: carry != null ? carry : s.standardHours,
            job1Actual: 0,
            job1Remainder: carry != null ? carry : 0,
            job1Completed: null,
            hasJob2: false,
            job2WagonNo: '',
            job2Standard: 0,
            job2Actual: 0,
            job2Remainder: 0,
            job2Completed: null,
            totalStandard: carry != null ? carry : s.standardHours,
            totalActual: 0,
            remainder: carry,
            isCarryover: carry != null,
            isIdle
          };
          if (!hasInput) {
            carry = null;
            carryWagon = null;
          }
          return result;
        }

        const isCarryover = carry != null;
        const job1WagonNo = (e?.wagonNo || carryWagon || '').trim();
        const job1Standard = carry != null ? carry : s.standardHours;
        const job1Actual = parseFloat(e?.actual) || 0;
        
        const isJob1InProgress = e?.job1Status === 'in_progress';
        let job1Remainder = 0;
        if (job1Standard != null) {
          if (isJob1InProgress) {
            job1Remainder = Math.max(job1Standard - job1Actual, 0);
          } else {
            job1Remainder = (job1Actual < job1Standard && !e?.actualEndTime) ? Math.max(job1Standard - job1Actual, 0) : 0;
          }
        }

        const hasJob2 = !!e?.hasSecondJob;
        const job2WagonNo = hasJob2 ? (e?.secondJobWagonNo || job1WagonNo || '').trim() : '';
        const job2Standard = hasJob2 ? (parseFloat(e?.secondJobStandard) || s.standardHours || 0) : 0;
        const job2Actual = hasJob2 ? (parseFloat(e?.secondJobActual) || 0) : 0;
        const isJob2InProgress = e?.secondJobStatus === 'in_progress';
        
        let job2Remainder = 0;
        if (hasJob2 && job2Standard > 0) {
          if (isJob2InProgress) {
            job2Remainder = Math.max(job2Standard - job2Actual, 0);
          } else {
            job2Remainder = (job2Actual < job2Standard && !e?.secondJobActualEndTime) ? Math.max(job2Standard - job2Actual, 0) : 0;
          }
        }

        if (hasJob2) {
          carry = (isJob2InProgress && job2Remainder > 0.05) ? job2Remainder : null;
          carryWagon = carry ? (e?.secondJobWagonNo || job1WagonNo || '') : null;
        } else {
          carry = (isJob1InProgress && job1Remainder > 0.05) ? job1Remainder : null;
          carryWagon = carry ? job1WagonNo : null;
        }

        const totalStandard = (job1Standard || 0) + (hasJob2 ? job2Standard : 0);
        const totalActual = job1Actual + job2Actual;

        return {
          baseCarry: isCarryover ? job1Standard : null,
          carryWagon,
          job1WagonNo,
          job1Standard,
          job1Actual,
          job1Remainder,
          job1Status: isJob1InProgress ? 'in_progress' : 'completed',
          job1Completed: (job1Standard && job1Actual > 0) ? (isJob1InProgress ? Math.min((job1Actual / job1Standard) * 100, 100) : 100) : null,
          hasJob2,
          job2WagonNo,
          job2Standard,
          job2Actual,
          job2Remainder,
          job2Status: isJob2InProgress ? 'in_progress' : 'completed',
          job2Completed: (job2Standard && job2Actual > 0) ? (isJob2InProgress ? Math.min((job2Actual / job2Standard) * 100, 100) : 100) : null,
          totalStandard: totalStandard > 0 ? totalStandard : null,
          totalActual: totalActual > 0 ? totalActual : null,
          remainder: carry,
          isCarryover,
          isIdle: false
        };
      });
      map[s.id] = days;
    });
    return map;
  }, [data, weekDates]);

  const finalCascade = useMemo(() => {
    let cursor = null;
    const results = [];
    FINAL_STAGES.forEach((name) => {
      const st = data.stations.find((s) => s.name === name);
      if (!st || !st.active) { results.push(null); return; }
      const entry = data.entries[`${selectedKey}|${st.id}`] || {};
      if (entry.isIdle) { results.push(null); return; }
      
      const explicitStart = timeToMin(entry.startTime);
      const startMin = explicitStart != null ? explicitStart : (cursor != null ? cursor : SHIFT_START_MIN);
      const totalStaff = parseFloat(entry.totalStaff) || 0;
      const absentStaff = parseFloat(entry.absentStaff) || 0;
      const present = Math.max(totalStaff - absentStaff, 0);
      const cInfo = carryoverMap[st.id]?.[dayIndex];
      const effectiveStandard = cInfo ? cInfo.totalStandard : st.standardHours;
      const neededMin = stageRequiredMinutes(effectiveStandard, present);
      let finishMin = null, mode = 'normal', overMinutes = 0, needsDecision = false, label = '—';
      if (neededMin != null) { 
        const r = estimateWithDecision(startMin, neededMin, entry.overtimeDecision, dayIndex); 
        finishMin = r.finishMin; mode = r.mode; overMinutes = r.overMinutes || 0; needsDecision = r.needsDecision; label = r.label;
      }
      const wagonNo = (entry.wagonNo || cInfo?.job1WagonNo || '').trim();
      results.push({ station: st, wagonNo, startMin, neededMin, finishMin, mode, overMinutes, needsDecision, label, present, autoStart: explicitStart == null, effectiveStandard, isCarryover: cInfo?.isCarryover });
      cursor = finishMin != null ? finishMin : startMin;
    });
    return results;
  }, [data, selectedKey, allowancePercent, carryoverMap, dayIndex]);

  const stationSummaries = useMemo(() => {
    return data.stations
      .filter((s) => showInactiveStations || s.active !== false)
      .map((s) => {
        let sum = 0, count = 0, totalActual = 0, totalStandardExpected = 0, totalAbsent = 0, totalLost = 0, presentSum = 0, presentDays = 0, totalCapacityShortfall = 0, idleDays = 0;
        const wagonStatusMap = {};
        
        weekDates.forEach((d, i) => {
          const e = data.entries[`${dateKey(d)}|${s.id}`];
          if (e?.isIdle) {
            idleDays += 1;
            return;
          }

          const cInfo = carryoverMap[s.id]?.[i];
          const act = (parseFloat(e?.actual) || 0) + (e?.hasSecondJob ? (parseFloat(e?.secondJobActual) || 0) : 0);
          const std = cInfo ? cInfo.totalStandard : s.standardHours;
          const eff = calcEff(act, std);
          
          if (eff !== null) { sum += eff; count += 1; }
          
          if (hasAnyInput(e) && !e?.isIdle) {
            const tot = parseFloat(e.totalStaff) || 0;
            const abs = parseFloat(e.absentStaff) || 0;
            totalActual += act;
            if (std != null) totalStandardExpected += std;
            totalAbsent += abs;
            totalLost += abs * shiftHours;
            
            if (tot > 0) {
              const present = Math.max(tot - abs, 0);
              presentSum += present; presentDays += 1;
              
              const isFinishedOnTime = (timeToMin(e.actualEndTime) ?? 999) <= SHIFT_END_MIN && e.job1Status !== 'in_progress';
              if (std != null && !isFinishedOnTime) {
                const shortfall = std - present * shiftHours;
                if (shortfall > 0.05) totalCapacityShortfall += shortfall;
              }
            }

            const dayName = DAY_NAMES[i];
            const w1 = (e.wagonNo || cInfo?.job1WagonNo || '').trim();
            if (w1) {
              if (!wagonStatusMap[w1]) wagonStatusMap[w1] = { name: w1, jobs: [] };
              wagonStatusMap[w1].jobs.push({
                day: dayName,
                job: '1. İş',
                status: e.job1Status === 'in_progress' ? 'Devam Ediyor' : (e.actualEndTime ? 'Tamamlandı' : 'Başlandı'),
                actual: parseFloat(e.actual) || 0,
                remainder: cInfo?.job1Remainder || 0,
                downtimeReason: e.downtimeReason
              });
            }
            if (e.hasSecondJob) {
              const w2 = (e.secondJobWagonNo || w1).trim();
              if (w2) {
                if (!wagonStatusMap[w2]) wagonStatusMap[w2] = { name: w2, jobs: [] };
                wagonStatusMap[w2].jobs.push({
                  day: dayName,
                  job: '2. İş',
                  status: e.secondJobStatus === 'in_progress' ? 'Devam Ediyor' : (e.secondJobActualEndTime ? 'Tamamlandı' : 'Başlandı'),
                  actual: parseFloat(e.secondJobActual) || 0,
                  remainder: cInfo?.job2Remainder || 0,
                  downtimeReason: e.downtimeReason
                });
              }
            }
          }
        });

        const lossTotal = totalStandardExpected > 0 ? totalActual - totalStandardExpected : null;
        const lossPercentAvg = (lossTotal != null && totalStandardExpected > 0) ? (lossTotal / totalStandardExpected) * 100 : null;
        const avgPresent = presentDays > 0 ? presentSum / presentDays : 0;
        const wagonsList = Object.values(wagonStatusMap);
        return { ...s, avg: count > 0 ? sum / count : null, totalActual, totalStandardExpected, lossTotal, lossPercentAvg, totalCapacityShortfall, totalAbsent, totalLost, avgPresent, days: count, idleDays, wagonsList, dayDetails: carryoverMap[s.id] || [] };
      }).sort((a, b) => { if (a.avg === null) return 1; if (b.avg === null) return -1; return b.avg - a.avg; });
  }, [data, weekDates, shiftHours, carryoverMap, showInactiveStations]);

  const weekAvg = useMemo(() => {
    const vals = stationSummaries.filter((s) => s.avg !== null && s.active !== false).map((s) => s.avg);
    if (vals.length === 0) return null;
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  }, [stationSummaries]);

  const groupTotals = useMemo(() => {
    const g = { taslama: { actual: 0, standard: 0 }, kaynakmontaj: { actual: 0, standard: 0 } };
    stationSummaries.filter((s) => s.active !== false).forEach((s) => { 
      g[s.group].actual += s.totalActual; 
      g[s.group].standard += s.totalStandardExpected; 
    });
    return g;
  }, [stationSummaries]);

  const overtimeStations = useMemo(() => stationSummaries.filter((s) => s.active !== false && s.totalCapacityShortfall > 0.05).sort((a, b) => b.totalCapacityShortfall - a.totalCapacityShortfall), [stationSummaries]);
  const absenteeismTotal = useMemo(() => stationSummaries.filter((s) => s.active !== false).reduce((acc, s) => ({ persons: acc.persons + s.totalAbsent, hours: acc.hours + s.totalLost }), { persons: 0, hours: 0 }), [stationSummaries]);
  const lossTotal = useMemo(() => stationSummaries.filter((s) => s.active !== false).reduce((acc, s) => acc + (s.lossTotal != null && s.lossTotal > 0 ? s.lossTotal : 0), 0), [stationSummaries]);

  // ADIM 2: DURUŞ VE KAYIP NEDENLERİ HAFTALIK ÖZETİ (PARETO)
  const downtimeSummary = useMemo(() => {
    const stats = {};
    DOWNTIME_REASONS.forEach(r => {
      stats[r.id] = { ...r, hours: 0, count: 0, stations: new Set() };
    });
    let totalDowntimeHours = 0;

    weekDates.forEach((d, i) => {
      data.stations.filter(s => s.active !== false).forEach(s => {
        const e = data.entries[`${dateKey(d)}|${s.id}`];
        if (!e || e.isIdle) return;
        const reasonId = e.downtimeReason;
        if (!reasonId || !stats[reasonId]) return;

        const cInfo = carryoverMap[s.id]?.[i];
        const act = (parseFloat(e.actual) || 0) + (e.hasSecondJob ? (parseFloat(e.secondJobActual) || 0) : 0);
        const std = cInfo ? cInfo.totalStandard : s.standardHours;
        const loss = (std != null && act > std) ? (act - std) : (e.job1Status === 'in_progress' ? (cInfo?.job1Remainder || 0) : 0);
        
        const lossEffective = loss > 0.05 ? loss : 1.0;
        stats[reasonId].hours += lossEffective;
        stats[reasonId].count += 1;
        stats[reasonId].stations.add(s.name);
        totalDowntimeHours += lossEffective;
      });
    });

    const list = Object.values(stats)
      .filter(s => s.count > 0)
      .map(s => ({
        ...s,
        percent: totalDowntimeHours > 0 ? (s.hours / totalDowntimeHours) * 100 : 0,
        stationsList: Array.from(s.stations)
      }))
      .sort((a, b) => b.hours - a.hours);

    return { list, totalDowntimeHours };
  }, [data, weekDates, carryoverMap]);

  // ADIM 1: TÜM VAGONLARIN HAFTALIK YAŞAM DÖNGÜSÜ KATALOĞU (WAGON MATRIX)
  const wagonsCatalog = useMemo(() => {
    const map = {};

    weekDates.forEach((d, i) => {
      const dayName = DAY_NAMES[i];
      const dFormatted = `${d.getDate()} ${MONTHS[d.getMonth()]}`;
      const dKey = dateKey(d);

      data.stations.filter(s => s.active !== false).forEach(s => {
        const e = data.entries[`${dKey}|${s.id}`];
        if (!e || e.isIdle) return;
        const cInfo = carryoverMap[s.id]?.[i];

        // 1. İş Vagonu
        const w1 = (e.wagonNo || cInfo?.job1WagonNo || '').trim();
        if (w1) {
          if (!map[w1]) {
            map[w1] = {
              wagonNo: w1,
              steps: [],
              totalActual: 0,
              totalStandard: 0,
              firstDay: dayName,
              latestStatus: 'İşlemde',
              stationsSet: new Set()
            };
          }
          const j1Act = parseFloat(e.actual) || 0;
          const j1Std = cInfo ? cInfo.job1Standard : s.standardHours;
          const isDone = (e.job1Status !== 'in_progress') && (e.actualEndTime != null);
          const j1StatusText = e.job1Status === 'in_progress' ? 'Devam Ediyor' : (isDone ? 'Tamamlandı' : 'Başlandı');
          
          map[w1].steps.push({
            day: dayName,
            dateStr: dFormatted,
            stationId: s.id,
            stationName: s.name,
            group: s.group,
            jobName: '1. İş',
            standard: j1Std,
            actual: j1Act,
            startTime: e.startTime,
            endTime: e.actualEndTime,
            status: j1StatusText,
            isDone,
            downtimeReason: e.downtimeReason
          });
          map[w1].totalActual += j1Act;
          if (j1Std != null) map[w1].totalStandard += j1Std;
          map[w1].latestStatus = j1StatusText;
          map[w1].stationsSet.add(s.name);
        }

        // 2. İş Vagonu
        if (e.hasSecondJob) {
          const w2 = (e.secondJobWagonNo || w1).trim();
          if (w2) {
            if (!map[w2]) {
              map[w2] = {
                wagonNo: w2,
                steps: [],
                totalActual: 0,
                totalStandard: 0,
                firstDay: dayName,
                latestStatus: 'İşlemde',
                stationsSet: new Set()
              };
            }
            const j2Act = parseFloat(e.secondJobActual) || 0;
            const j2Std = parseFloat(e.secondJobStandard) || s.standardHours;
            const isDone2 = (e.secondJobStatus !== 'in_progress') && (e.secondJobActualEndTime != null);
            const j2StatusText = e.secondJobStatus === 'in_progress' ? 'Devam Ediyor' : (isDone2 ? 'Tamamlandı' : 'Başlandı');

            map[w2].steps.push({
              day: dayName,
              dateStr: dFormatted,
              stationId: s.id,
              stationName: s.name,
              group: s.group,
              jobName: '2. İş',
              standard: j2Std,
              actual: j2Act,
              startTime: e.secondJobStartTime,
              endTime: e.secondJobActualEndTime,
              status: j2StatusText,
              isDone: isDone2,
              downtimeReason: e.downtimeReason
            });
            map[w2].totalActual += j2Act;
            if (j2Std != null) map[w2].totalStandard += j2Std;
            map[w2].latestStatus = j2StatusText;
            map[w2].stationsSet.add(s.name);
          }
        }
      });
    });

    return Object.values(map).map(w => {
      const overallEff = calcEff(w.totalActual, w.totalStandard);
      return {
        ...w,
        stationsCount: w.stationsSet.size,
        stationsList: Array.from(w.stationsSet),
        overallEff
      };
    }).sort((a, b) => a.wagonNo.localeCompare(b.wagonNo, undefined, { numeric: true }));
  }, [data, weekDates, carryoverMap]);

  // Filtrelenmiş Vagon Listesi (Arama ve Duruma göre)
  const filteredWagons = useMemo(() => {
    return wagonsCatalog.filter(w => {
      const matchesSearch = !wagonSearchQuery.trim() || w.wagonNo.toLowerCase().includes(wagonSearchQuery.trim().toLowerCase()) || w.stationsList.some(st => st.toLowerCase().includes(wagonSearchQuery.trim().toLowerCase()));
      const matchesStatus = wagonStatusFilter === 'all' ? true : (wagonStatusFilter === 'completed' ? w.latestStatus === 'Tamamlandı' : w.latestStatus !== 'Tamamlandı');
      return matchesSearch && matchesStatus;
    });
  }, [wagonsCatalog, wagonSearchQuery, wagonStatusFilter]);

  // Seçili vagon detay nesnesi
  const currentWagonDetailObj = useMemo(() => {
    if (!selectedWagonDetail) return null;
    return wagonsCatalog.find(w => w.wagonNo === selectedWagonDetail) || null;
  }, [wagonsCatalog, selectedWagonDetail]);

  // ADIM 4: HAFTANIN EN BAŞARILI 3 İSTASYONU (YILDIZLAR)
  const topStations = useMemo(() => {
    return stationSummaries.filter(s => s.active !== false && s.avg !== null).slice(0, 3);

  function exportCSV() {
    const header = ['Tarih', 'İstasyon', 'Grup', 'Durum', '1. İş Vagon No', '1. İş Durumu', '1. İş Başlangıç', '1. İş Bitiş', '1. İş Standart (a-s)', '1. İş Gerçekleşen (a-s)', '2. İş Vagon No', '2. İş Durumu', '2. İş Başlangıç', '2. İş Bitiş', '2. İş Standart (a-s)', '2. İş Gerçekleşen (a-s)', 'Toplam Standart', 'Toplam Gerçekleşen', 'Personel', 'Devamsız', 'Duruş Nedeni', 'Verim (%)'];
    const lines = [header.join(';')];
    weekDates.forEach((d) => {
      const dKey = dateKey(d);
      data.stations.filter(s => s.active !== false).forEach((s) => {
        const e = data.entries[`${dKey}|${s.id}`];
        if (!hasAnyInput(e)) return;
        if (e.isIdle) {
          lines.push([dKey, s.name, GROUP_LABEL[s.group], 'Planlı Boşta', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', ''].join(';'));
          return;
        }
        const cDay = carryoverMap[s.id]?.find((_, idx) => weekDates[idx].getTime() === d.getTime());
        const act = (parseFloat(e.actual) || 0) + (e.hasSecondJob ? (parseFloat(e.secondJobActual) || 0) : 0);
        const std = cDay ? cDay.totalStandard : s.standardHours;
        const eff = calcEff(act, std);

        const w1 = (e.wagonNo || cDay?.job1WagonNo || '').trim();
        const j1Status = e.job1Status === 'in_progress' ? 'Devam Ediyor' : (e.actualEndTime ? 'Tamamlandı' : 'Başlandı');
        const w2 = e.hasSecondJob ? ((e.secondJobWagonNo || w1).trim()) : '';
        const j2Status = e.hasSecondJob ? (e.secondJobStatus === 'in_progress' ? 'Devam Ediyor' : (e.secondJobActualEndTime ? 'Tamamlandı' : 'Başlandı')) : '';
        const dt = getDowntimeInfo(e.downtimeReason);

        lines.push([
          dKey, 
          s.name, 
          GROUP_LABEL[s.group], 
          'Çalışıyor', 
          w1,
          j1Status,
          e.startTime || '', 
          e.actualEndTime || '', 
          cDay ? cDay.job1Standard : '', 
          e.actual || '', 
          w2,
          j2Status,
          e.hasSecondJob ? e.secondJobStartTime : '', 
          e.hasSecondJob ? e.secondJobActualEndTime : '', 
          e.hasSecondJob ? e.secondJobStandard : '', 
          e.hasSecondJob ? e.secondJobActual : '',
          std ?? '',
          act > 0 ? act.toFixed(1) : '',
          e.totalStaff || '', 
          e.absentStaff || '', 
          dt ? dt.short : '',
          eff === null ? '' : Math.round(eff)
        ].join(';'));
      });
    });
    const csv = '\uFEFF' + lines.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `istasyon-verim-vagon-${dateKey(weekStart)}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

            {/* Ek Mesai Gereken Istasyonlar */}
            <div style={{ marginBottom: 20 }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: C.dim, textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 8 }}>
                Ek Mesai Gerekebilecek İstasyonlar
              </div>
              {overtimeStations.length === 0 ? (
                <div style={{ background: C.successBadgeBg, border: `1px solid ${C.successBadgeBorder}`, borderRadius: 8, padding: 12, fontSize: 13, color: C.good, fontWeight: 500 }}>
                  ✓ Bu hafta ek mesai gereken istasyon görünmüyor.
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                  {overtimeStations.map((s) => (
                    <div key={s.id} style={{ background: C.dangerBadgeBg, border: `1px solid ${C.dangerBadgeBorder}`, borderRadius: 8, padding: '10px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 6 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <GroupTag group={s.group} />
                        <span style={{ fontWeight: 600, color: C.paper }}>{s.name}</span>
                      </div>
                      <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: C.bad, fontWeight: 600 }}>
                        ≈{s.totalCapacityShortfall.toFixed(1)} a-s kapasite açığı{s.avgPresent > 0 ? ` · ≈${(s.totalCapacityShortfall / s.avgPresent).toFixed(1)} saat/kişi` : ''}
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Haftalik Ozet Tablosu */}
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10, flexWrap: 'wrap', gap: 8 }}>
              <span style={{ fontSize: 12, fontWeight: 600, color: C.dim, textTransform: 'uppercase', letterSpacing: 0.5 }}>Haftalık Özet — İstasyon Bazlı</span>
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={printReport} style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, color: C.paper, padding: '6px 14px', fontSize: 12, cursor: 'pointer', fontWeight: 600, boxShadow: C.cardShadow }}>Yazdır / PDF</button>
                <button onClick={exportCSV} style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, color: C.paper, padding: '6px 14px', fontSize: 12, cursor: 'pointer', fontWeight: 600, boxShadow: C.cardShadow }}>CSV İndir</button>
              </div>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: 10 }}>
              {stationSummaries.map((s, i) => (
                <div key={s.id} style={{ background: C.summaryCardBg, border: `1px solid ${C.border}`, borderRadius: 8, padding: '12px 14px', boxShadow: C.cardShadow, opacity: s.active === false ? 0.6 : 1 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 }}>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
                      <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: C.dim }}>{String(i + 1).padStart(2, '0')}</span>
                      <span style={{ fontWeight: 600, fontSize: 13, color: C.paper }}>
                        {s.name} {s.active === false && <span style={{ fontSize: 11, color: C.bad }}>(Pasif)</span>}
                      </span>
                    </div>
                    <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 15, fontWeight: 700, color: effColor(s.avg, C) }}>
                      {s.avg === null ? (s.idleDays > 0 ? 'Boşta' : '—') : `${Math.round(s.avg)}%`}
                    </span>
                  </div>
                  <div style={{ marginBottom: 6 }}><GroupTag group={s.group} /></div>
                  <DimensionBar eff={s.avg} />
                  <div style={{ fontSize: 11, color: C.dim, marginTop: 8 }}>
                    {s.days > 0 ? `${s.totalActual.toFixed(1)} a-s gerçekleşen${s.totalStandardExpected > 0 ? ` / ${s.totalStandardExpected.toFixed(1)} a-s hedef` : ''}` : (s.idleDays > 0 ? `${s.idleDays} gün planlı boşta` : 'Veri yok')}
                  </div>
                  {s.wagonsList && s.wagonsList.length > 0 && (
                    <div style={{ marginTop: 8, paddingTop: 6, borderTop: `1px solid ${C.border}`, display: 'flex', flexWrap: 'wrap', gap: 4 }}>
                      {s.wagonsList.map((w) => {
                        const last = w.jobs[w.jobs.length - 1];
                        const isDone = last.status === 'Tamamlandı';
                        return (
                          <span 
                            key={w.name} 
                            onClick={() => setSelectedWagonDetail(w.name)}
                            title={`${last.day} - ${last.job}: ${last.status} (Tıkla Detayı Gör)`} 
                            style={{ fontSize: 10, fontFamily: "'JetBrains Mono', monospace", padding: '2px 6px', borderRadius: 4, background: isDone ? C.successBadgeBg : C.warningBadgeBg, color: isDone ? C.good : C.copper, border: `1px solid ${isDone ? C.successBadgeBorder : C.warningBadgeBorder}`, fontWeight: 600, cursor: 'pointer' }}
                          >
                            🚆 #{w.name}: {isDone ? '✓' : '⏳'}
                          </span>
                        );
                      })}
                    </div>
                  )}
                </div>
              ))}
            </div>
          </>
        )}

        {/* 2. GÖRÜNÜM: VAGON İZLEME MATRİSİ (ADIM 1) */}
        {mainView === 'wagons' && (
          <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: 20, boxShadow: C.cardShadow }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 10, marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 16, fontWeight: 700, color: C.paper }}>🚆 Vagon İzleme Matrisi & Süreç Takibi</div>
                <div style={{ fontSize: 12, color: C.dim }}>Bu hafta hat üzerinde işlem gören tüm vagonların aşama ve durum tablosu</div>
              </div>

              {/* Vagon Filtreleri */}
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                <button
                  onClick={() => setWagonStatusFilter('all')}
                  style={{ background: wagonStatusFilter === 'all' ? C.line : C.panelAlt, color: wagonStatusFilter === 'all' ? (theme === 'light' ? '#fff' : '#0B0F17') : C.paper, border: `1px solid ${C.border}`, borderRadius: 6, padding: '5px 12px', fontSize: 11.5, fontWeight: 600, cursor: 'pointer' }}
                >
                  Tümü ({wagonsCatalog.length})
                </button>
                <button
                  onClick={() => setWagonStatusFilter('in_progress')}
                  style={{ background: wagonStatusFilter === 'in_progress' ? C.copper : C.panelAlt, color: wagonStatusFilter === 'in_progress' ? '#fff' : C.paper, border: `1px solid ${C.border}`, borderRadius: 6, padding: '5px 12px', fontSize: 11.5, fontWeight: 600, cursor: 'pointer' }}
                >
                  Devam Edenler ({wagonsCatalog.filter(w => w.latestStatus !== 'Tamamlandı').length})
                </button>
                <button
                  onClick={() => setWagonStatusFilter('completed')}
                  style={{ background: wagonStatusFilter === 'completed' ? C.good : C.panelAlt, color: wagonStatusFilter === 'completed' ? '#fff' : C.paper, border: `1px solid ${C.border}`, borderRadius: 6, padding: '5px 12px', fontSize: 11.5, fontWeight: 600, cursor: 'pointer' }}
                >
                  Tamamlananlar ({wagonsCatalog.filter(w => w.latestStatus === 'Tamamlandı').length})
                </button>
              </div>
            </div>

            {filteredWagons.length === 0 ? (
              <div style={{ padding: '36px 0', textAlign: 'center', color: C.dim, fontSize: 13 }}>
                Arama kriterine uygun vagon bulunamadı veya henüz vagon numarası girilmedi.
              </div>
            ) : (
              <div style={{ overflowX: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
                  <thead>
                    <tr style={{ borderBottom: `2px solid ${C.border}`, textAlign: 'left' }}>
                      <th style={{ padding: '10px 12px', color: C.dim }}>Vagon No</th>
                      <th style={{ padding: '10px 12px', color: C.dim }}>Başlangıç</th>
                      <th style={{ padding: '10px 12px', color: C.dim }}>İstasyon Süreci</th>
                      <th style={{ padding: '10px 12px', color: C.dim, textAlign: 'right' }}>Toplam a-s</th>
                      <th style={{ padding: '10px 12px', color: C.dim, textAlign: 'center' }}>Verim</th>
                      <th style={{ padding: '10px 12px', color: C.dim, textAlign: 'center' }}>Son Durum</th>
                      <th style={{ padding: '10px 12px', color: C.dim, textAlign: 'right' }}>İşlem</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredWagons.map((w) => (
                      <tr key={w.wagonNo} style={{ borderBottom: `1px solid ${C.border}`, transition: 'background 0.15s' }}>
                        <td style={{ padding: '12px', fontWeight: 700, color: C.line, fontFamily: "'JetBrains Mono', monospace", fontSize: 13.5 }}>
                          #{w.wagonNo}
                        </td>
                        <td style={{ padding: '12px', color: C.paper, fontWeight: 500 }}>
                          {w.firstDay}
                        </td>
                        <td style={{ padding: '12px' }}>
                          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4 }}>
                            {w.steps.map((st, idx) => (
                              <span key={idx} style={{ fontSize: 10.5, padding: '2px 6px', borderRadius: 4, background: st.isDone ? C.successBadgeBg : C.warningBadgeBg, color: st.isDone ? C.good : C.copper, border: `1px solid ${st.isDone ? C.successBadgeBorder : C.warningBadgeBorder}`, fontWeight: 600 }}>
                                {st.stationName} ({st.day})
                              </span>
                            ))}
                          </div>
                        </td>
                        <td style={{ padding: '12px', textAlign: 'right', fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, color: C.paper }}>
                          {w.totalActual.toFixed(1)} a-s
                        </td>
                        <td style={{ padding: '12px', textAlign: 'center', fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, color: effColor(w.overallEff, C) }}>
                          {w.overallEff != null ? `${Math.round(w.overallEff)}%` : '—'}
                        </td>
                        <td style={{ padding: '12px', textAlign: 'center' }}>
                          <span style={{ fontSize: 11, padding: '3px 8px', borderRadius: 4, background: w.latestStatus === 'Tamamlandı' ? C.successBadgeBg : C.warningBadgeBg, color: w.latestStatus === 'Tamamlandı' ? C.good : C.copper, border: `1px solid ${w.latestStatus === 'Tamamlandı' ? C.successBadgeBorder : C.warningBadgeBorder}`, fontWeight: 600 }}>
                            {w.latestStatus}
                          </span>
                        </td>
                        <td style={{ padding: '12px', textAlign: 'right' }}>
                          <button
                            onClick={() => setSelectedWagonDetail(w.wagonNo)}
                            style={{ background: C.headerBtnBg, border: `1px solid ${C.border}`, borderRadius: 6, color: C.line, padding: '4px 10px', fontSize: 11.5, fontWeight: 600, cursor: 'pointer' }}
                          >
                            Detay ➔
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}

        {/* 3. GÖRÜNÜM: YÖNETİCİ GRAFİKLERİ VE KPI DASHBOARD'U (ADIM 4) */}
        {mainView === 'analytics' && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            
            {/* Üst 4 KPI Kartı */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 12 }}>
              <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: 16, boxShadow: C.cardShadow }}>
                <div style={{ fontSize: 11.5, color: C.dim, textTransform: 'uppercase', fontWeight: 600 }}>Fabrika Toplam Üretim</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 24, fontWeight: 700, color: C.line, marginTop: 4 }}>
                  {(groupTotals.taslama.actual + groupTotals.kaynakmontaj.actual).toFixed(1)} <span style={{ fontSize: 13, color: C.dim }}>a-s</span>
                </div>
                <div style={{ fontSize: 11, color: C.dim, marginTop: 2 }}>Bu haftaki fiili çalışma hacmi</div>
              </div>

              <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: 16, boxShadow: C.cardShadow }}>
                <div style={{ fontSize: 11.5, color: C.dim, textTransform: 'uppercase', fontWeight: 600 }}>Ortalama Fabrika Verimi</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 24, fontWeight: 700, color: effColor(weekAvg, C), marginTop: 4 }}>
                  {weekAvg === null ? '—' : Math.round(weekAvg)}%
                </div>
                <div style={{ fontSize: 11, color: C.dim, marginTop: 2 }}>Hedef standart karşılaştırması</div>
              </div>

              <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: 16, boxShadow: C.cardShadow }}>
                <div style={{ fontSize: 11.5, color: C.dim, textTransform: 'uppercase', fontWeight: 600 }}>Devamsızlık Kaybı</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 24, fontWeight: 700, color: C.bad, marginTop: 4 }}>
                  {absenteeismTotal.hours.toFixed(1)} <span style={{ fontSize: 13, color: C.dim }}>a-s</span>
                </div>
                <div style={{ fontSize: 11, color: C.dim, marginTop: 2 }}>{absenteeismTotal.persons} kişi-gün iş gücü kaybı</div>
              </div>

              <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: 16, boxShadow: C.cardShadow }}>
                <div style={{ fontSize: 11.5, color: C.dim, textTransform: 'uppercase', fontWeight: 600 }}>Duruş & Verim Kaybı</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 24, fontWeight: 700, color: C.copper, marginTop: 4 }}>
                  {lossTotal.toFixed(1)} <span style={{ fontSize: 13, color: C.dim }}>a-s</span>
                </div>
                <div style={{ fontSize: 11, color: C.dim, marginTop: 2 }}>Duruş ve standardı aşan kayıplar</div>
              </div>
            </div>

            {/* Grafikler Izgarası (Trend & Pareto) */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(360px, 1fr))', gap: 16 }}>
              <TrendChart weekDates={weekDates} data={data} carryoverMap={carryoverMap} stations={data.stations} />
              <ParetoChart downtimeSummary={downtimeSummary} />
            </div>

            {/* Bölüm Karşılaştırması (Taşlama vs Kaynak-Montaj) & Haftanın Yıldızları */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(360px, 1fr))', gap: 16 }}>
              
              {/* Taşlama vs Kaynak Kıyası */}
              <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: 18, boxShadow: C.cardShadow }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: C.paper, marginBottom: 14 }}>⚖️ Taşlama vs. Kaynak-Montaj Karşılaştırması</div>
                
                <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 4 }}>
                      <span style={{ fontWeight: 600, color: C.groupA }}>Taşlama Bölümü</span>
                      <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, color: C.groupA }}>
                        {groupTotals.taslama.actual.toFixed(1)} a-s
                      </span>
                    </div>
                    <div style={{ height: 10, background: C.trackBg, borderRadius: 5, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: `${Math.min((groupTotals.taslama.actual / Math.max(groupTotals.taslama.actual + groupTotals.kaynakmontaj.actual, 1)) * 100, 100)}%`, background: C.groupA, borderRadius: 5 }} />
                    </div>
                  </div>

                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 4 }}>
                      <span style={{ fontWeight: 600, color: C.groupB }}>Kaynak-Montaj Bölümü</span>
                      <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, color: C.groupB }}>
                        {groupTotals.kaynakmontaj.actual.toFixed(1)} a-s
                      </span>
                    </div>
                    <div style={{ height: 10, background: C.trackBg, borderRadius: 5, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: `${Math.min((groupTotals.kaynakmontaj.actual / Math.max(groupTotals.taslama.actual + groupTotals.kaynakmontaj.actual, 1)) * 100, 100)}%`, background: C.groupB, borderRadius: 5 }} />
                    </div>
                  </div>
                </div>

                <div style={{ marginTop: 14, paddingTop: 10, borderTop: `1px solid ${C.border}`, display: 'flex', justifyContent: 'space-between', fontSize: 11.5, color: C.dim }}>
                  <span>Toplam Üretim Dağılım Payı</span>
                  <span>{groupTotals.taslama.actual + groupTotals.kaynakmontaj.actual > 0 ? `%${Math.round((groupTotals.taslama.actual / (groupTotals.taslama.actual + groupTotals.kaynakmontaj.actual)) * 100)} Taşlama · %${Math.round((groupTotals.kaynakmontaj.actual / (groupTotals.taslama.actual + groupTotals.kaynakmontaj.actual)) * 100)} Kaynak` : 'Veri yok'}</span>
                </div>
              </div>

              {/* Haftanın Yıldız İstasyonları (Top 3) */}
              <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: 18, boxShadow: C.cardShadow }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: C.paper, marginBottom: 14 }}>🏆 Haftanın En Yüksek Verimli İstasyonları</div>
                
                {topStations.length === 0 ? (
                  <div style={{ padding: '16px 0', textAlign: 'center', color: C.dim, fontSize: 12 }}>Bu hafta için henüz verim verisi bulunmuyor.</div>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                    {topStations.map((s, idx) => {
                      const medal = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : '🥉');
                      return (
                        <div key={s.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 12px', background: C.panelAlt, border: `1px solid ${C.border}`, borderRadius: 6 }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                            <span style={{ fontSize: 18 }}>{medal}</span>
                            <div>
                              <div style={{ fontWeight: 600, fontSize: 13, color: C.paper }}>{s.name}</div>
                              <GroupTag group={s.group} />
                            </div>
                          </div>
                          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 16, fontWeight: 700, color: effColor(s.avg, C) }}>
                            {Math.round(s.avg)}%
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          </div>
        )}

        <div style={{ marginTop: 28, fontSize: 11.5, color: C.dim, textAlign: 'center' }}>
          Epsilon Solentek İstasyon Verim Panosu · Firebase Cloud Veritabanı
        </div>
      </div>
    </div>
  );
}

function Root() {
  const [authState, setAuthState] = useState('loading');
  const [currentUser, setCurrentUser] = useState(null);
  const [themeMode, setThemeMode] = useState(() => {
    return localStorage.getItem('est_app_theme') || 'light';
  });

  const toggleTheme = () => {
    setThemeMode((prev) => {
      const next = prev === 'light' ? 'dark' : 'light';
      localStorage.setItem('est_app_theme', next);
      return next;
    });
  };

  const C = THEMES[themeMode] || THEMES.light;

  useEffect(() => {
    document.body.setAttribute('data-theme', themeMode);
    document.body.style.backgroundColor = C.page;
    document.body.style.color = C.paper;
  }, [themeMode, C.page, C.paper]);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged((user) => {
      setCurrentUser(user);
      setAuthState(user ? 'signed-in' : 'signed-out');
    });
    return unsub;
  }, []);

  const contextValue = useMemo(() => ({
    theme: themeMode,
    toggleTheme,
    C
  }), [themeMode, C]);

  if (authState === 'loading') {
    return (
      <div style={{ minHeight: '100vh', background: C.page, display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.dim, fontFamily: "'Segoe UI', sans-serif" }}>
        Yükleniyor…
      </div>
    );
  }

  return (
    <ThemeContext.Provider value={contextValue}>
      {authState === 'signed-out' ? (
        <LoginScreen />
      ) : (
        <App currentUser={currentUser} onLogout={() => auth.signOut()} />
      )}
    </ThemeContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
