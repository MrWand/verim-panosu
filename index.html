const SHIFT_BLOCKS = [
  { start: '06:55', end: '09:30' },
  { start: '09:45', end: '12:00' },
  { start: '12:50', end: '15:15' },
  { start: '15:30', end: '16:55' },
];
const OVERTIME_BLOCK = { start: '17:25', end: '20:00' };
const ALL_BLOCKS = [...SHIFT_BLOCKS, OVERTIME_BLOCK];

function timeToMin(t) { if (!t) return null; const parts = t.split(':'); if (parts.length < 2) return null; const h = parseInt(parts[0], 10), m = parseInt(parts[1], 10); if (isNaN(h) || isNaN(m)) return null; return h * 60 + m; }
function minToTime(m) { if (m == null || isNaN(m)) return '—'; m = Math.round(m); const h = Math.floor(m / 60), mm = m % 60; return `${String(h).padStart(2, '0')}:${String(mm).padStart(2, '0')}`; }
const SHIFT_START_MIN = timeToMin(SHIFT_BLOCKS[0].start);
const SHIFT_END_MIN = timeToMin(SHIFT_BLOCKS[SHIFT_BLOCKS.length - 1].end);
const OT_END_MIN = timeToMin(OVERTIME_BLOCK.end);
const NET_SHIFT_MIN = SHIFT_BLOCKS.reduce((acc, b) => acc + (timeToMin(b.end) - timeToMin(b.start)), 0);

function workMinutesBetween(startMin, endMin, blocks) {
  blocks = blocks || ALL_BLOCKS;
  if (startMin == null || endMin == null || endMin <= startMin) return 0;
  let total = 0;
  blocks.forEach((block) => {
    const bStart = timeToMin(block.start), bEnd = timeToMin(block.end);
    const segStart = Math.max(bStart, startMin);
    const segEnd = Math.min(bEnd, endMin);
    if (segEnd > segStart) total += segEnd - segStart;
  });
  return total;
}

function getStationStaffTimeline(dKey, stationId, stations, entries) {
  const entry = entries[`${dKey}|${stationId}`] || {};
  const totalStaff = parseFloat(entry.totalStaff) || 0;
  const absentStaff = parseFloat(entry.absentStaff) || 0;
  const baseStaff = Math.max(totalStaff - absentStaff, 0);

  const events = [];

  const ownShifts = entry.staffShifts || [];
  ownShifts.forEach(sh => {
    if (!sh.time) return;
    const m = timeToMin(sh.time);
    if (m == null) return;
    
    let count = sh.transferredCount != null ? parseFloat(sh.transferredCount) : (sh.staff != null ? Math.max(baseStaff - parseFloat(sh.staff), 0) : 0);
    if (isNaN(count)) count = 0;

    const targetSt = stations.find(st => st.id === sh.targetStationId);
    let targetName = 'Dış Görev / Saha';
    if (sh.targetStationId === 'pause') targetName = 'İstasyon Beklemede / Durduruldu';
    else if (targetSt) targetName = targetSt.name;

    events.push({
      timeMin: m,
      timeStr: sh.time,
      delta: -count,
      type: 'outbound',
      targetStationId: sh.targetStationId,
      targetStationName: targetName,
      wagonNo: sh.targetWagonNo || '',
      count
    });
  });

  stations.forEach(otherSt => {
    if (otherSt.id === stationId) return;
    const otherEntry = entries[`${dKey}|${otherSt.id}`];
    if (!otherEntry || otherEntry.isIdle) return;
    (otherEntry.staffShifts || []).forEach(sh => {
      if (sh.targetStationId === stationId && sh.time) {
        const m = timeToMin(sh.time);
        if (m == null) return;
        const count = parseFloat(sh.transferredCount) || 0;
        if (count > 0) {
          events.push({
            timeMin: m,
            timeStr: sh.time,
            delta: +count,
            type: 'inbound',
            fromStationId: otherSt.id,
            fromStationName: otherSt.name,
            wagonNo: sh.targetWagonNo || '',
            count
          });
        }
      }
    });
  });

  events.sort((a, b) => a.timeMin - b.timeMin);
  return { baseStaff, events };
}

function getStaffAtMinute(m, baseStaff, events) {
  let current = baseStaff;
  for (const ev of events) {
    if (ev.timeMin <= m) {
      current += ev.delta;
    }
  }
  return Math.max(current, 0);
}

function calcDynamicSegmentsActual(startMin, endMin, baseStaff, events) {
  if (startMin == null || endMin == null || endMin <= startMin) return { totalActual: 0, segments: [] };
  
  const points = [startMin];
  events.forEach(ev => {
    if (ev.timeMin > startMin && ev.timeMin < endMin && !points.includes(ev.timeMin)) {
      points.push(ev.timeMin);
    }
  });
  points.push(endMin);
  points.sort((a, b) => a - b);

  let totalActual = 0;
  const segments = [];

  for (let i = 0; i < points.length - 1; i++) {
    const sFrom = points[i];
    const sTo = points[i + 1];
    if (sTo <= sFrom) continue;

    const staffNow = getStaffAtMinute(sFrom, baseStaff, events);
    const netMin = workMinutesBetween(sFrom, sTo, ALL_BLOCKS);
    const act = Math.round(((netMin * staffNow) / 60) * 100) / 100;
    totalActual += act;

    const ev = events.filter(e => e.timeMin === sFrom).pop();

    segments.push({
      fromTime: minToTime(sFrom),
      toTime: minToTime(sTo),
      staff: staffNow,
      netMin,
      act,
      isPaused: staffNow === 0,
      event: ev || null
    });
  }

  return { totalActual: Math.round(totalActual * 100) / 100, segments };
}

function estimateDynamicFinishTime(startMin, standardHours, baseStaff, events, decision, dayIdx = 0) {
  if (standardHours == null || standardHours <= 0) return { finishMin: startMin, mode: 'normal', label: minToTime(startMin) };
  
  const hasStaff = baseStaff > 0 || events.some(e => e.delta > 0);
  if (!hasStaff) return null;

  let remainingManMinutes = standardHours * 60;

  function consumeMinutes(fromMin, toMin, blocks) {
    for (const b of blocks) {
      const bStart = timeToMin(b.start), bEnd = timeToMin(b.end);
      if (bEnd <= fromMin || bStart >= toMin) continue;
      const segStart = Math.max(bStart, fromMin);
      const segEnd = Math.min(bEnd, toMin);

      for (let m = segStart; m < segEnd; m++) {
        const staffNow = getStaffAtMinute(m, baseStaff, events);
        if (staffNow > 0) {
          remainingManMinutes -= staffNow;
          if (remainingManMinutes <= 0) {
            return { finishMin: m + 1, finished: true };
          }
        }
      }
    }
    return { finishMin: toMin, finished: false };
  }

  const norm = consumeMinutes(startMin, SHIFT_END_MIN, SHIFT_BLOCKS);
  if (norm.finished) {
    return { finishMin: norm.finishMin, mode: 'normal', needsDecision: false, label: minToTime(norm.finishMin) };
  }

  if (dayIdx === 4) {
    if (decision === 'yes' || decision === 'friday_ot') {
      const ot = consumeMinutes(SHIFT_END_MIN, OT_END_MIN, [OVERTIME_BLOCK]);
      if (ot.finished) return { finishMin: ot.finishMin, mode: 'overtime', needsDecision: false, label: `${minToTime(ot.finishMin)} (Cuma Mesai)` };
      const sat = consumeMinutes(SHIFT_START_MIN, SHIFT_END_MIN, SHIFT_BLOCKS);
      if (sat.finished) return { finishMin: sat.finishMin, mode: 'weekend_sat', needsDecision: false, label: `↷ Cmt ${minToTime(sat.finishMin)}` };
      const sun = consumeMinutes(SHIFT_START_MIN, SHIFT_END_MIN, SHIFT_BLOCKS);
      return { finishMin: sun.finishMin, mode: 'weekend_sun', needsDecision: false, label: `↷ Paz ${minToTime(sun.finishMin)}` };
    }
    if (decision === 'sat_only') {
      const sat = consumeMinutes(SHIFT_START_MIN, SHIFT_END_MIN, SHIFT_BLOCKS);
      if (sat.finished) return { finishMin: sat.finishMin, mode: 'weekend_sat', needsDecision: false, label: `↷ Cmt ${minToTime(sat.finishMin)}` };
      const sun = consumeMinutes(SHIFT_START_MIN, SHIFT_END_MIN, SHIFT_BLOCKS);
      return { finishMin: sun.finishMin, mode: 'weekend_sun', needsDecision: false, label: `↷ Paz ${minToTime(sun.finishMin)}` };
    }
    if (decision === 'no') {
      return { finishMin: norm.finishMin, mode: 'carryover', needsDecision: false, label: '↷ Pzt Devir' };
    }
    return { finishMin: norm.finishMin, mode: 'pending_friday', needsDecision: true, label: '? Karar Bekliyor' };
  }

  if (decision === 'yes') {
    const ot = consumeMinutes(SHIFT_END_MIN, OT_END_MIN, [OVERTIME_BLOCK]);
    if (ot.finished) return { finishMin: ot.finishMin, mode: 'overtime', needsDecision: false, label: minToTime(ot.finishMin) };
    return { finishMin: ot.finishMin, mode: 'exceeds', overMinutes: 30, needsDecision: false, label: '> 20:00 (Aşım)' };
  }
  if (decision === 'no') {
    return { finishMin: norm.finishMin, mode: 'carryover', needsDecision: false, label: '↷ Devir' };
  }
  return { finishMin: norm.finishMin, mode: 'pending', needsDecision: true, label: '? Karar Bekliyor' };
}

function calcLiveProgress(startMin, finishMin, isDone, nowMin) {
  if (isDone) {
    return { percent: 100, label: '%100 (Tamamlandı)', status: 'done', color: '#10B981' };
  }
  if (startMin == null || finishMin == null) {
    return { percent: null, label: '—', status: 'unknown', color: '#64748B' };
  }
  if (nowMin < startMin) {
    return { percent: 0, label: '%0 (Henüz Başlamadı)', status: 'not_started', color: '#64748B' };
  }
  if (nowMin >= finishMin) {
    return { percent: 100, label: '%100 (Teorik Süre Doldu)', status: 'due', color: '#F59E0B' };
  }

  const totalNet = workMinutesBetween(startMin, finishMin, ALL_BLOCKS) || Math.max(finishMin - startMin, 1);
  const elapsedNet = workMinutesBetween(startMin, nowMin, ALL_BLOCKS);
  const pct = Math.min(Math.max(Math.round((elapsedNet / totalNet) * 100), 1), 99);

  return {
    percent: pct,
    label: `%${pct} İşlemde`,
    status: 'in_progress',
    color: pct >= 80 ? '#38BDF8' : (pct >= 40 ? '#0284C7' : '#D97706')
  };
}

function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = date.getDate() - day + (day === 0 ? -6 : 1);
  date.setDate(diff);
  date.setHours(0, 0, 0, 0);
  return date;
}
function addDays(d, n) { const nd = new Date(d); nd.setDate(nd.getDate() + n); return nd; }
function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function formatRange(monday) {
  const sunday = addDays(monday, 6);
  if (monday.getMonth() === sunday.getMonth()) {
    return `${monday.getDate()}–${sunday.getDate()} ${MONTHS[monday.getMonth()]} ${monday.getFullYear()}`;
  }
  return `${monday.getDate()} ${MONTHS[monday.getMonth()]} – ${sunday.getDate()} ${MONTHS[sunday.getMonth()]} ${sunday.getFullYear()}`;
}

function calcEff(totalActual, totalStandard) {
  if (totalActual == null || totalStandard == null || totalActual <= 0 || totalStandard <= 0) return null;
  return Math.min((totalStandard / totalActual) * 100, 999);
}

function effColor(eff, C) {
  if (eff === null) return C.dim;
  if (eff >= 90) return C.good;
  if (eff >= 70) return C.copper;
  return C.bad;
}

function hasAnyInput(e) {
  return !!(e && (e.isIdle || e.wagonNo || e.secondJobWagonNo || e.actual || e.secondJobActual || e.totalStaff || e.absentStaff || e.target || e.produced || e.startTime || e.actualEndTime || e.downtimeReason || (e.staffShifts && e.staffShifts.length > 0)));
}

function TrendChart({ weekDates, data, carryoverMap, stations }) {
  const { C } = useTheme();

  const dailyEffs = useMemo(() => {
    return weekDates.map((d, i) => {
      let sum = 0, count = 0;
      stations.filter(s => s.active !== false).forEach(s => {
        const e = data.entries[`${dateKey(d)}|${s.id}`];
        if (!e || e.isIdle) return;
        const act = (parseFloat(e.actual) || 0) + (e.hasSecondJob ? (parseFloat(e.secondJobActual) || 0) : 0);
        const cInfo = carryoverMap[s.id]?.[i];
        const std = cInfo ? cInfo.totalStandard : s.standardHours;
        const eff = calcEff(act, std);
        if (eff !== null) { sum += eff; count += 1; }
      });
      return count > 0 ? Math.round(sum / count) : 0;
    });
  }, [weekDates, data, carryoverMap, stations]);

  const maxVal = Math.max(120, ...dailyEffs);
  const chartHeight = 170;

  return (
    <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 20, boxShadow: C.cardShadow }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
        <span style={{ fontSize: 14.5, fontWeight: 800, color: C.paper, display: 'flex', alignItems: 'center', gap: 6 }}>
          <span>📈</span> Günlük Fabrika Verim Trendi (%)
        </span>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, fontSize: 12, color: C.dim }}>
          <span style={{ display: 'flex', alignItems: 'center', gap: 5 }}><span style={{ width: 12, height: 10, background: C.line, borderRadius: 3 }} /> Gerçekleşen</span>
          <span style={{ display: 'flex', alignItems: 'center', gap: 5 }}><span style={{ width: 14, height: 3, background: C.good, borderRadius: 2 }} /> %100 Hedef</span>
        </div>
      </div>

      <svg width="100%" height={chartHeight} viewBox={`0 0 520 ${chartHeight}`} style={{ overflow: 'visible' }}>
        <line x1="45" y1="30" x2="510" y2="30" stroke={C.chartGrid} strokeDasharray="3 3" />
        <text x="36" y="34" fill={C.chartText} fontSize="11" fontWeight="600" textAnchor="end">100%</text>

        <line x1="45" y1="85" x2="510" y2="85" stroke={C.chartGrid} strokeDasharray="3 3" />
        <text x="36" y="89" fill={C.chartText} fontSize="11" fontWeight="600" textAnchor="end">50%</text>

        <line x1="45" y1="140" x2="510" y2="140" stroke={C.border} strokeWidth="1.5" />
        <text x="36" y="144" fill={C.chartText} fontSize="11" fontWeight="600" textAnchor="end">0%</text>

        {(() => {
          const targetY = 140 - (100 / maxVal) * 110;
          return <line x1="45" y1={targetY} x2="510" y2={targetY} stroke={C.good} strokeWidth="2" strokeDasharray="4 4" />;
        })()}

        {dailyEffs.map((val, idx) => {
          const x = 75 + idx * 62;
          const barHeight = val > 0 ? (val / maxVal) * 110 : 3;
          const y = 140 - barHeight;
          const barColor = val >= 90 ? C.good : (val >= 70 ? C.copper : (val > 0 ? C.bad : C.dim));

          return (
            <g key={idx}>
              <rect x={x - 18} y={y} width="36" height={barHeight} rx="5" fill={barColor} opacity="0.9" />
              <text x={x} y={y - 6} fill={C.paper} fontSize="12" fontWeight="800" textAnchor="middle" fontFamily="'JetBrains Mono', monospace">
                {val > 0 ? `${val}%` : '—'}
              </text>
              <text x={x} y="158" fill={C.dim} fontSize="12" fontWeight="700" textAnchor="middle">
                {DAY_NAMES[idx]}
              </text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

                <div style={{ height: '100%', width: `${Math.min(item.percent, 100)}%`, background: item.color, borderRadius: 5, transition: 'width 0.4s ease' }} />
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function LoginScreen() {

  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    if (!username.trim() || password.length < 6) {
      setError('Kullanıcı adı gir ve en az 6 karakterli bir şifre seç.');
      return;
    }
    setBusy(true);
    const email = usernameToEmail(username);
    try {
      if (mode === 'register') {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await cred.user.updateProfile({ displayName: username.trim() });
      } else {
        await auth.signInWithEmailAndPassword(email, password);
      }

      <form onSubmit={handleSubmit} style={{ width: '100%', maxWidth: 400, background: C.loginCardBg, border: `1px solid ${C.border}`, borderRadius: 14, padding: 36, boxShadow: C.cardShadowHover }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 8 }}>
          <div style={{ width: 42, height: 42, borderRadius: 10, background: 'linear-gradient(135deg, #0284C7, #0369A1)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontSize: 22, fontWeight: 800 }}>🚆</div>
          <div>
            <div style={{ fontWeight: 800, fontSize: 20, color: C.paper, letterSpacing: -0.3 }}>İstasyon Verim Panosu</div>
            <div style={{ fontSize: 13, color: C.dim }}>Epsilon Solentek Raylı Sistemler</div>
          </div>
        </div>

        <div style={{ display: 'flex', gap: 6, margin: '24px 0 20px', background: C.loginTabBg, padding: 4, borderRadius: 10 }}>
          <button type="button" onClick={() => { setMode('login'); setError(''); }} style={{ flex: 1, padding: '9px 0', fontSize: 13.5, fontWeight: 700, cursor: 'pointer', background: mode === 'login' ? C.loginActiveTabBg : 'transparent', border: mode === 'login' ? `1px solid ${C.border}` : 'none', color: mode === 'login' ? C.loginActiveTabText : C.dim, borderRadius: 8, boxShadow: mode === 'login' ? '0 1px 3px rgba(0,0,0,0.06)' : 'none' }}>Giriş Yap</button>
          <button type="button" onClick={() => { setMode('register'); setError(''); }} style={{ flex: 1, padding: '9px 0', fontSize: 13.5, fontWeight: 700, cursor: 'pointer', background: mode === 'register' ? C.loginActiveTabBg : 'transparent', border: mode === 'register' ? `1px solid ${C.border}` : 'none', color: mode === 'register' ? C.loginActiveTabText : C.dim, borderRadius: 8, boxShadow: mode === 'register' ? '0 1px 3px rgba(0,0,0,0.06)' : 'none' }}>Yeni Hesap</button>

        <input value={username} onChange={(e) => setUsername(e.target.value)} placeholder="örn. ahmet" className="num-input num-input-lg" style={{ marginBottom: 16, textAlign: 'left' }} />
        
        <div style={{ fontSize: 12.5, fontWeight: 700, color: C.dim, marginBottom: 6 }}>Şifre</div>

          {busy ? 'Bekleyin…' : mode === 'register' ? 'Hesap Oluştur' : 'Giriş Yap'}

}

function App({ currentUser, onLogout }) {
  const { theme, toggleTheme, C } = useTheme();
  const [data, setData] = useState({ stations: [], entries: {}, settings: { allowancePercent: 10 } });
  const [connected, setConnected] = useState(true);
  const [weekStart, setWeekStart] = useState(() => getMonday(new Date()));
  const [dayIndex, setDayIndex] = useState(() => { const d = new Date().getDay(); return d === 0 ? 6 : d - 1; });
  const [newStation, setNewStation] = useState('');
  const [newGroup, setNewGroup] = useState('kaynak');
  const [newStandard, setNewStandard] = useState('');
  const [showInactiveStations, setShowInactiveStations] = useState(false);
  const [showWeekendModal, setShowWeekendModal] = useState(false);
  const [lastEdit, setLastEdit] = useState(null);
  
  const [mainView, setMainView] = useState('dashboard');
  const [selectedWagonDetail, setSelectedWagonDetail] = useState(null);
  const [wagonSearchQuery, setWagonSearchQuery] = useState('');
  const [wagonStatusFilter, setWagonStatusFilter] = useState('all');

  const [openShiftPanelStationId, setOpenShiftPanelStationId] = useState(null);
  const [isStationDrawerOpen, setIsStationDrawerOpen] = useState(false);

  const [draggedIndex, setDraggedIndex] = useState(null);
  const [dragOverIndex, setDragOverIndex] = useState(null);
  
  const [currentWallTime, setCurrentWallTime] = useState(() => new Date());
  useEffect(() => {
    const timer = setInterval(() => setCurrentWallTime(new Date()), 30000);
    return () => clearInterval(timer);
  }, []);

  const nowMin = currentWallTime.getHours() * 60 + currentWallTime.getMinutes();

  const pendingWrites = useRef({});
  const username = currentUser?.displayName || currentUser?.email || 'Bilinmeyen';

  function recordActivity() {
    db.collection('meta').doc('lastEdit').set({ username, timestamp: Date.now() }).catch(() => {});
  }

  useEffect(() => {
    const unsubLastEdit = db.collection('meta').doc('lastEdit').onSnapshot((doc) => {
      setLastEdit(doc.exists ? doc.data() : null);
    }, () => {});
    return () => unsubLastEdit();
  }, []);

  useEffect(() => {
    const onOnline = () => setConnected(true);
    const onOffline = () => setConnected(false);
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    setConnected(navigator.onLine);

    let seededEmpty = false;

    const unsubStations = db.collection('stations').onSnapshot((snap) => {
      let stations = snap.docs.map((d) => {
        const sData = d.data();
        const resolvedGroup = resolveStationGroup(sData.name, sData.group);
        return {
          id: d.id,
          active: sData.active !== false,
          ...sData,
          group: resolvedGroup
        };
      });

      const oldFinal = stations.find((s) => s.name && s.name.trim().toLowerCase() === 'final temizlik');
      if (oldFinal) {
        db.collection('stations').doc(oldFinal.id).delete().catch(() => {});
        stations = stations.filter((s) => s.id !== oldFinal.id);
      }
      if (!seededEmpty && stations.length === 0) {
        seededEmpty = true;
        const batch = db.batch();
        DEFAULT_STATIONS.forEach((d, i) => {
          const id = 'seed_' + Date.now().toString(36) + '_' + i;
          batch.set(db.collection('stations').doc(id), { name: d.name, group: d.group, standardHours: d.standardHours, active: true, order: i });
        });
        batch.commit().catch((e) => console.error('Tohumlama hatası', e));
      } else if (stations.length > 0) {
        const existingNames = new Set(stations.map((s) => s.name.trim().toLowerCase()));
        DEFAULT_STATIONS.filter((d) => !existingNames.has(d.name.trim().toLowerCase())).forEach((d, i) => {
          const id = 'seed_' + Date.now().toString(36) + '_' + i;
          db.collection('stations').doc(id).set({ name: d.name, group: d.group, standardHours: d.standardHours, active: true, order: 900 + i }).catch(() => {});
        });
      }

      stations.sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
      setData((prev) => ({ ...prev, stations }));
    }, (err) => { console.error('İstasyon senkron hatası', err); setConnected(false); });

    const unsubEntries = db.collection('entries').onSnapshot((snap) => {
      const entries = {};
      snap.docs.forEach((d) => { entries[d.id] = d.data(); });
      setData((prev) => ({ ...prev, entries }));
    }, (err) => { console.error('Giriş senkron hatası', err); setConnected(false); });

    const unsubSettings = db.collection('settings').doc('global').onSnapshot((doc) => {
      const settings = doc.exists ? doc.data() : { allowancePercent: 10 };
      if (!doc.exists) db.collection('settings').doc('global').set({ allowancePercent: 10 }).catch(() => {});
      setData((prev) => ({ ...prev, settings }));
    }, (err) => { console.error('Ayar senkron hatası', err); setConnected(false); });

    return () => { window.removeEventListener('online', onOnline); window.removeEventListener('offline', onOffline); unsubStations(); unsubEntries(); unsubSettings(); };
  }, []);

  function scheduleWrite(collectionName, docId, patch) {
    const key = `${collectionName}/${docId}`;
    const existing = pendingWrites.current[key] || { data: {} };
    existing.data = { ...existing.data, ...patch };
    if (existing.timer) clearTimeout(existing.timer);
    existing.timer = setTimeout(() => {
      const toWrite = pendingWrites.current[key]?.data;
      delete pendingWrites.current[key];
      db.collection(collectionName).doc(docId).set(toWrite, { merge: true }).then(() => recordActivity()).catch((e) => console.error('Yazma hatası', e));
    }, 450);
    pendingWrites.current[key] = existing;
  }

  const shiftHours = NET_SHIFT_MIN / 60;
  const allowancePercent = parseFloat(data.settings?.allowancePercent) || 0;
  const weekDates = useMemo(() => Array.from({ length: 7 }, (_, i) => addDays(weekStart, i)), [weekStart]);
  const selectedDate = weekDates[dayIndex];
  const selectedKey = dateKey(selectedDate);
  const isWeekendDay = dayIndex === 5 || dayIndex === 6;

  function updateSettings(field, value) {
    setData((prev) => ({ ...prev, settings: { ...prev.settings, [field]: value } }));
    scheduleWrite('settings', 'global', { [field]: value });
  }
  
  function addStation() {
    const name = newStation.trim();
    if (!name) return;
    const id = 'st_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const newOrder = data.stations.length;
    const resolvedGrp = resolveStationGroup(name, newGroup);
    const st = { id, name, group: resolvedGrp, standardHours: newStandard === '' ? null : parseFloat(newStandard), active: true, order: newOrder };
    setData((prev) => ({ ...prev, stations: [...prev.stations, st] }));
    db.collection('stations').doc(id).set(st).then(() => recordActivity()).catch((e) => console.error('Yazma hatası', e));
    setNewStation(''); setNewStandard('');
  }

  function handleDragStart(e, index) {
    setDraggedIndex(index);
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', index);
  }

  function handleDragOver(e, index) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (dragOverIndex !== index) {
      setDragOverIndex(index);
    }
  }

  function handleDrop(e, targetIndex) {
    e.preventDefault();
    if (draggedIndex === null || draggedIndex === targetIndex) {
      setDraggedIndex(null);
      setDragOverIndex(null);
      return;
    }

    const reordered = [...data.stations];
    const [moved] = reordered.splice(draggedIndex, 1);
    reordered.splice(targetIndex, 0, moved);

    const updated = reordered.map((s, idx) => ({ ...s, order: idx }));
    setData((prev) => ({ ...prev, stations: updated }));
    setDraggedIndex(null);
    setDragOverIndex(null);

    const batch = db.batch();
    updated.forEach((s) => {
      batch.update(db.collection('stations').doc(s.id), { order: s.order });
    });
    batch.commit().then(() => recordActivity()).catch((err) => console.error('Sıralama kaydetme hatası', err));
  }

  function moveStation(index, direction) {
    const targetIndex = index + direction;
    if (targetIndex < 0 || targetIndex >= data.stations.length) return;

    const reordered = [...data.stations];
    const [moved] = reordered.splice(index, 1);
    reordered.splice(targetIndex, 0, moved);

    const updated = reordered.map((s, idx) => ({ ...s, order: idx }));
    setData((prev) => ({ ...prev, stations: updated }));

    const batch = db.batch();
    updated.forEach((s) => {
      batch.update(db.collection('stations').doc(s.id), { order: s.order });
    });
    batch.commit().then(() => recordActivity()).catch((err) => console.error('Sıralama kaydetme hatası', err));
  }

  function toggleStationActive(id, currentStatus) {
    const newStatus = !currentStatus;
    setData((prev) => ({
      ...prev,
      stations: prev.stations.map((s) => s.id === id ? { ...s, active: newStatus } : s)
    }));
    scheduleWrite('stations', id, { active: newStatus });
  }

  function removeStation(id) {
    if (!confirm('Bu istasyonu tamamen silmek istediğinizden emin misiniz?')) return;
    setData((prev) => {
      const entries = { ...prev.entries };
      Object.keys(entries).forEach((k) => { if (k.endsWith('|' + id)) delete entries[k]; });
      return { stations: prev.stations.filter((s) => s.id !== id), entries, settings: prev.settings };
    });
    db.collection('stations').doc(id).delete().then(() => recordActivity()).catch((e) => console.error('Silme hatası', e));
    Object.keys(data.entries).forEach((k) => {
      if (k.endsWith('|' + id)) db.collection('entries').doc(k).delete().catch(() => {});
    });
  }

  function updateStationField(id, field, value) {
    setData((prev) => ({ ...prev, stations: prev.stations.map((s) => s.id === id ? { ...s, [field]: value } : s) }));
    scheduleWrite('stations', id, { [field]: value });
  }

  function updateEntry(dKey, stationId, field, value) {
    const key = `${dKey}|${stationId}`;
    const current = data.entries[key] || {};
    const merged = { ...current, [field]: value };
    const patch = { [field]: value };

    const tempEntries = { ...data.entries, [key]: merged };
    const timeline = getStationStaffTimeline(dKey, stationId, data.stations, tempEntries);

    if (merged.actualEndTime && !merged.isIdle) {
      const startMin = timeToMin(merged.startTime) ?? SHIFT_START_MIN;
      const endMin = timeToMin(merged.actualEndTime);
      if (endMin != null) {
        const dyn = calcDynamicSegmentsActual(startMin, endMin, timeline.baseStaff, timeline.events);
        patch.actual = dyn.totalActual;
      }
    } else if (field === 'actualEndTime' && !value) {
      patch.actual = '';
    }

    if (merged.hasSecondJob && merged.secondJobActualEndTime && !merged.isIdle) {
      const startMin2 = timeToMin(merged.secondJobStartTime) ?? (timeToMin(merged.actualEndTime) || SHIFT_START_MIN);
      const endMin2 = timeToMin(merged.secondJobActualEndTime);
      if (endMin2 != null && timeline.baseStaff > 0) {
        const workMin2 = workMinutesBetween(startMin2, endMin2, ALL_BLOCKS);
        patch.secondJobActual = Math.round(((workMin2 * timeline.baseStaff) / 60) * 100) / 100;
      }
    } else if (field === 'secondJobActualEndTime' && !value) {
      patch.secondJobActual = '';
    }
    
    setData((prev) => {
      const entries = { ...prev.entries };
      entries[key] = { ...(entries[key] || {}), ...patch };
      return { ...prev, entries };
    });
    scheduleWrite('entries', key, patch);
  }

  function addStaffShift(dKey, stationId, defaultTime, defaultCount, defaultTargetId) {
    const key = `${dKey}|${stationId}`;
    const current = data.entries[key] || {};
    const list = [...(current.staffShifts || [])];
    list.push({
      id: Date.now().toString(36),
      time: defaultTime || '11:00',
      transferredCount: defaultCount != null ? defaultCount : 4,
      targetStationId: defaultTargetId || '',
      targetWagonNo: current.wagonNo || ''
    });
    updateEntry(dKey, stationId, 'staffShifts', list);
  }

  function updateStaffShiftItem(dKey, stationId, shiftIndex, field, value) {
    const key = `${dKey}|${stationId}`;
    const current = data.entries[key] || {};
    const list = [...(current.staffShifts || [])];
    if (!list[shiftIndex]) return;
    list[shiftIndex] = { ...list[shiftIndex], [field]: value };
    updateEntry(dKey, stationId, 'staffShifts', list);
  }

  function removeStaffShiftItem(dKey, stationId, shiftIndex) {
    const key = `${dKey}|${stationId}`;
    const current = data.entries[key] || {};
    const list = [...(current.staffShifts || [])];
    list.splice(shiftIndex, 1);
    updateEntry(dKey, stationId, 'staffShifts', list);
  }

  function toggleSecondJob(dKey, stationId, defaultStart, defaultStandard) {
    const key = `${dKey}|${stationId}`;
    const current = data.entries[key] || {};
    const hasSecond = !current.hasSecondJob;
    const patch = { 
      hasSecondJob: hasSecond,
      secondJobWagonNo: hasSecond ? (current.secondJobWagonNo || current.wagonNo || '') : '',
      secondJobStartTime: hasSecond ? (current.actualEndTime || defaultStart || '12:50') : '',
      secondJobStandard: hasSecond ? (current.secondJobStandard || defaultStandard || '') : '',
      secondJobActualEndTime: hasSecond ? (current.secondJobActualEndTime || '') : '',
      secondJobActual: hasSecond ? (current.secondJobActual || '') : '',
      secondJobStatus: 'completed'
    };
    setData((prev) => {
      const entries = { ...prev.entries };
      entries[key] = { ...(entries[key] || {}), ...patch };
      return { ...prev, entries };
    });
    scheduleWrite('entries', key, patch);
  }

  function toggleDayIdle(dKey, stationId) {
    const key = `${dKey}|${stationId}`;
    const current = data.entries[key] || {};
    const newIdle = !current.isIdle;
    const patch = { isIdle: newIdle };
    if (newIdle) {
      patch.actual = '';
      patch.startTime = '';
      patch.actualEndTime = '';
      patch.secondJobActual = '';
      patch.secondJobActualEndTime = '';
    }
    setData((prev) => {
      const entries = { ...prev.entries };
      entries[key] = { ...(entries[key] || {}), ...patch };
      return { ...prev, entries };
    });
    scheduleWrite('entries', key, patch);
  }

  function resetStationDayData(dKey, stationId, stationName) {
    if (!confirm(`${stationName} istasyonunun bu güne ait tüm verilerini sıfırlamak istediğinize emin misiniz?`)) return;
    const key = `${dKey}|${stationId}`;
    const updatedEntries = { ...data.entries };
    delete updatedEntries[key];
    setData((prev) => ({ ...prev, entries: updatedEntries }));
    db.collection('entries').doc(key).delete().then(() => recordActivity()).catch((e) => console.error('İstasyon sıfırlama hatası', e));
  }

  function resetDayData() {
    const dayLabel = `${DAY_NAMES[dayIndex]} ${selectedDate.getDate()} ${MONTHS[selectedDate.getMonth()]}`;
    if (!confirm(`${dayLabel} gününe ait TÜM istasyon verilerini sıfırlamak istediğinize emin misiniz? Bu işlem geri alınamaz.`)) return;

    const batch = db.batch();
    const updatedEntries = { ...data.entries };

    data.stations.forEach((s) => {
      const key = `${selectedKey}|${s.id}`;
      if (updatedEntries[key]) {
        delete updatedEntries[key];
        batch.delete(db.collection('entries').doc(key));
      }
    });

    setData((prev) => ({ ...prev, entries: updatedEntries }));
    batch.commit().then(() => recordActivity()).catch((e) => console.error('Sıflama hatası', e));
  }

  function hasDataForDate(d) {
    const k = dateKey(d);
    return data.stations.some((s) => hasAnyInput(data.entries[`${k}|${s.id}`]));
  }

  const carryoverMap = useMemo(() => {
    const map = {};
    data.stations.forEach((s) => {
      let carry = null;
      let carryWagon = null;
      const days = weekDates.map((d, dayIdx) => {
        const dKey = dateKey(d);
        const e = data.entries[`${dKey}|${s.id}`];
        const hasInput = hasAnyInput(e);
        const isIdle = !!e?.isIdle;

        if (!hasInput || isIdle) {
          const result = {
            baseCarry: carry,
            carryWagon,
            job1WagonNo: carryWagon || '',
            job1Standard: carry != null ? carry : s.standardHours,
            job1Actual: 0,
            job1Remainder: carry != null ? carry : 0,
            job1Completed: null,
            hasJob2: false,
            job2WagonNo: '',
            job2Standard: 0,
            job2Actual: 0,
            job2Remainder: 0,
            job2Completed: null,
            totalStandard: carry != null ? carry : s.standardHours,
            totalActual: 0,
            remainder: carry,
            isCarryover: carry != null,
            isIdle
          };
          if (!hasInput) {
            carry = null;
            carryWagon = null;
          }
          return result;
        }

        const isCarryover = carry != null;
        const job1WagonNo = (e?.wagonNo || carryWagon || '').trim();
        const job1Standard = carry != null ? carry : s.standardHours;
        const job1Actual = parseFloat(e?.actual) || 0;
        
        const timeline = getStationStaffTimeline(dKey, s.id, data.stations, data.entries);
        const j1StartMin = timeToMin(e?.startTime) ?? SHIFT_START_MIN;
        const j1Est = job1Standard != null ? estimateDynamicFinishTime(j1StartMin, job1Standard, timeline.baseStaff, timeline.events, e?.overtimeDecision, dayIdx) : null;
        
        const willSpillOver = j1Est && (j1Est.mode === 'exceeds' || j1Est.mode === 'carryover' || j1Est.finishMin > (e?.overtimeDecision === 'yes' ? OT_END_MIN : SHIFT_END_MIN));
        const isJob1ExplicitDone = e?.job1Status === 'completed' && !!e?.actualEndTime;
        const isJob1InProgress = e?.job1Status === 'in_progress' || (!isJob1ExplicitDone && willSpillOver);

        let job1Remainder = 0;
        if (job1Standard != null) {
          if (e?.actualEndTime && job1Actual > 0) {
            job1Remainder = Math.max(job1Standard - job1Actual, 0);
          } else if (willSpillOver) {
            const shiftLimitMin = e?.overtimeDecision === 'yes' ? OT_END_MIN : SHIFT_END_MIN;
            const dynCap = calcDynamicSegmentsActual(j1StartMin, shiftLimitMin, timeline.baseStaff, timeline.events);
            job1Remainder = Math.max(job1Standard - dynCap.totalActual, 0);
          } else if (isJob1InProgress) {
            job1Remainder = Math.max(job1Standard - job1Actual, 0);
          }
        }

        const hasJob2 = !!e?.hasSecondJob;
        const job2WagonNo = hasJob2 ? (e?.secondJobWagonNo || job1WagonNo || '').trim() : '';
        const job2Standard = hasJob2 ? (parseFloat(e?.secondJobStandard) || s.standardHours || 0) : 0;
        const job2Actual = hasJob2 ? (parseFloat(e?.secondJobActual) || 0) : 0;
        
        let j2Est = null;
        if (hasJob2 && job2Standard > 0) {
          const j2StartMin = timeToMin(e?.secondJobStartTime) ?? (timeToMin(e?.actualEndTime) || SHIFT_START_MIN);
          j2Est = estimateDynamicFinishTime(j2StartMin, job2Standard, timeline.baseStaff, [], e?.overtimeDecision, dayIdx);
        }
        const willJob2SpillOver = j2Est && (j2Est.mode === 'exceeds' || j2Est.mode === 'carryover');
        const isJob2ExplicitDone = e?.secondJobStatus === 'completed' && !!e?.secondJobActualEndTime;
        const isJob2InProgress = e?.secondJobStatus === 'in_progress' || (!isJob2ExplicitDone && willJob2SpillOver);

        let job2Remainder = 0;
        if (hasJob2 && job2Standard > 0) {
          if (e?.secondJobActualEndTime && job2Actual > 0) {
            job2Remainder = Math.max(job2Standard - job2Actual, 0);
          } else if (willJob2SpillOver) {
            const shiftLimitMin = e?.overtimeDecision === 'yes' ? OT_END_MIN : SHIFT_END_MIN;
            const j2StartMin = timeToMin(e?.secondJobStartTime) ?? (timeToMin(e?.actualEndTime) || SHIFT_START_MIN);
            const netMin = workMinutesBetween(j2StartMin, shiftLimitMin, ALL_BLOCKS);
            const j2Cap = ((netMin * timeline.baseStaff) / 60);
            job2Remainder = Math.max(job2Standard - j2Cap, 0);
          } else if (isJob2InProgress) {
            job2Remainder = Math.max(job2Standard - job2Actual, 0);
          }
        }

        if (hasJob2) {
          carry = (isJob2InProgress && job2Remainder > 0.05) ? Math.round(job2Remainder * 10) / 10 : null;
          carryWagon = carry ? (e?.secondJobWagonNo || job1WagonNo || '') : null;
        } else {
          carry = (isJob1InProgress && job1Remainder > 0.05) ? Math.round(job1Remainder * 10) / 10 : null;
          carryWagon = carry ? job1WagonNo : null;
        }

        const totalStandard = (job1Standard || 0) + (hasJob2 ? job2Standard : 0);
        const totalActual = job1Actual + job2Actual;

        return {
          baseCarry: isCarryover ? job1Standard : null,
          carryWagon,
          job1WagonNo,
          job1Standard,
          job1Actual,
          job1Remainder,
          job1Status: isJob1InProgress ? 'in_progress' : 'completed',
          job1Completed: (job1Standard && job1Actual > 0) ? (isJob1InProgress ? Math.min((job1Actual / job1Standard) * 100, 100) : 100) : null,
          hasJob2,
          job2WagonNo,
          job2Standard,
          job2Actual,
          job2Remainder,
          job2Status: isJob2InProgress ? 'in_progress' : 'completed',
          job2Completed: (job2Standard && job2Actual > 0) ? (isJob2InProgress ? Math.min((job2Actual / job2Standard) * 100, 100) : 100) : null,
          totalStandard: totalStandard > 0 ? totalStandard : null,
          totalActual: totalActual > 0 ? totalActual : null,
          remainder: carry,
          isCarryover,
          isIdle: false
        };
      });
      map[s.id] = days;
    });
    return map;
  }, [data, weekDates]);

  const finalCascade = useMemo(() => {
    let cursor = null;
    const results = [];
    FINAL_STAGES.forEach((name) => {
      const st = data.stations.find((s) => s.name === name);
      if (!st || !st.active) { results.push(null); return; }
      const entry = data.entries[`${selectedKey}|${st.id}`] || {};
      if (entry.isIdle) { results.push(null); return; }
      
      const explicitStart = timeToMin(entry.startTime);
      const startMin = explicitStart != null ? explicitStart : (cursor != null ? cursor : SHIFT_START_MIN);
      
      const timeline = getStationStaffTimeline(selectedKey, st.id, data.stations, data.entries);
      const cInfo = carryoverMap[st.id]?.[dayIndex];
      const effectiveStandard = cInfo ? cInfo.totalStandard : st.standardHours;

      let finishMin = null, mode = 'normal', overMinutes = 0, needsDecision = false, label = '—';
      if (effectiveStandard != null) { 
        const r = estimateDynamicFinishTime(startMin, effectiveStandard, timeline.baseStaff, timeline.events, entry.overtimeDecision, dayIndex);
        if (r) {
          finishMin = r.finishMin; mode = r.mode; overMinutes = r.overMinutes || 0; needsDecision = r.needsDecision; label = r.label;
        }
      }
      const wagonNo = (entry.wagonNo || cInfo?.job1WagonNo || '').trim();
      results.push({ station: st, wagonNo, startMin, finishMin, mode, overMinutes, needsDecision, label, present: timeline.baseStaff, autoStart: explicitStart == null, effectiveStandard, isCarryover: cInfo?.isCarryover });
      cursor = finishMin != null ? finishMin : startMin;
    });
    return results;
  }, [data, selectedKey, carryoverMap, dayIndex]);

  const stationSummaries = useMemo(() => {
    return data.stations
      .filter((s) => showInactiveStations || s.active !== false)
      .map((s) => {
        let sum = 0, count = 0, totalActual = 0, totalStandardExpected = 0, totalAbsent = 0, totalLost = 0, presentSum = 0, presentDays = 0, totalCapacityShortfall = 0, idleDays = 0;
        const wagonStatusMap = {};
        
        weekDates.forEach((d, i) => {
          const dKey = dateKey(d);
          const e = data.entries[`${dKey}|${s.id}`];
          if (e?.isIdle) {
            idleDays += 1;
            return;
          }

          const cInfo = carryoverMap[s.id]?.[i];
          const act = (parseFloat(e?.actual) || 0) + (e?.hasSecondJob ? (parseFloat(e?.secondJobActual) || 0) : 0);
          
          let dayStandardContribution = 0;
          if (cInfo) {
            if (!cInfo.isCarryover && cInfo.job1Standard != null) {
              dayStandardContribution += cInfo.job1Standard;
            }
            if (cInfo.hasJob2 && cInfo.job2Standard > 0) {
              dayStandardContribution += cInfo.job2Standard;
            }
          } else if (s.standardHours != null) {
            dayStandardContribution += s.standardHours;
          }

          const eff = calcEff(act, cInfo ? cInfo.totalStandard : s.standardHours);
          if (eff !== null) { sum += eff; count += 1; }
          
          if (hasAnyInput(e) && !e?.isIdle) {
            const tot = parseFloat(e.totalStaff) || 0;
            const abs = parseFloat(e.absentStaff) || 0;
            totalActual += act;
            totalStandardExpected += dayStandardContribution;
            totalAbsent += abs;
            totalLost += abs * shiftHours;
            
            if (tot > 0) {
              const present = Math.max(tot - abs, 0);
              presentSum += present; presentDays += 1;
              
              const isFinishedOnTime = (timeToMin(e.actualEndTime) ?? 999) <= SHIFT_END_MIN && e.job1Status !== 'in_progress';
              const stdForCap = cInfo ? cInfo.totalStandard : s.standardHours;
              if (stdForCap != null && !isFinishedOnTime) {
                const shortfall = stdForCap - present * shiftHours;
                if (shortfall > 0.05) totalCapacityShortfall += shortfall;
              }
            }

            const dayName = DAY_NAMES[i];
            const w1 = (e.wagonNo || cInfo?.job1WagonNo || '').trim();
            if (w1) {
              if (!wagonStatusMap[w1]) wagonStatusMap[w1] = { name: w1, jobs: [] };
              wagonStatusMap[w1].jobs.push({
                day: dayName,
                job: cInfo?.isCarryover ? '1. İş (Devir Tamamlama)' : '1. İş',
                status: e.job1Status === 'in_progress' ? 'Devam Ediyor' : (e.actualEndTime ? 'Tamamlandı' : 'Başlandı'),
                actual: parseFloat(e.actual) || 0,
                remainder: cInfo?.job1Remainder || 0,
                isCarryover: cInfo?.isCarryover,
                downtimeReason: e.downtimeReason
              });
            }
            if (e.hasSecondJob) {
              const w2 = (e.secondJobWagonNo || w1).trim();
              if (w2) {
                if (!wagonStatusMap[w2]) wagonStatusMap[w2] = { name: w2, jobs: [] };
                wagonStatusMap[w2].jobs.push({
                  day: dayName,
                  job: '2. İş',
                  status: e.secondJobStatus === 'in_progress' ? 'Devam Ediyor' : (e.secondJobActualEndTime ? 'Tamamlandı' : 'Başlandı'),
                  actual: parseFloat(e.secondJobActual) || 0,
                  remainder: cInfo?.job2Remainder || 0,
                  isCarryover: false,
                  downtimeReason: e.downtimeReason
                });
              }
            }
          }
        });

        const lossTotal = totalStandardExpected > 0 ? totalActual - totalStandardExpected : null;
        const lossPercentAvg = (lossTotal != null && totalStandardExpected > 0) ? (lossTotal / totalStandardExpected) * 100 : null;
        const avgPresent = presentDays > 0 ? presentSum / presentDays : 0;
        const wagonsList = Object.values(wagonStatusMap);
        return { ...s, avg: count > 0 ? sum / count : null, totalActual, totalStandardExpected, lossTotal, lossPercentAvg, totalCapacityShortfall, totalAbsent, totalLost, avgPresent, days: count, idleDays, wagonsList, dayDetails: carryoverMap[s.id] || [] };
      });
  }, [data, weekDates, shiftHours, carryoverMap, showInactiveStations]);

  const weekAvg = useMemo(() => {
    const vals = stationSummaries.filter((s) => s.avg !== null && s.active !== false).map((s) => s.avg);
    if (vals.length === 0) return null;
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  }, [stationSummaries]);

  const groupTotals = useMemo(() => {
    const g = { 
      taslama: { actual: 0, standard: 0 }, 
      montaj: { actual: 0, standard: 0 }, 
      kaynak: { actual: 0, standard: 0 } 
    };
    stationSummaries.filter((s) => s.active !== false).forEach((s) => { 
      const grp = g[s.group] ? s.group : 'montaj';
      g[grp].actual += s.totalActual; 
      g[grp].standard += s.totalStandardExpected; 
    });
    return g;
  }, [stationSummaries]);

  const overtimeStations = useMemo(() => stationSummaries.filter((s) => s.active !== false && s.totalCapacityShortfall > 0.05).sort((a, b) => b.totalCapacityShortfall - a.totalCapacityShortfall), [stationSummaries]);
  const absenteeismTotal = useMemo(() => stationSummaries.filter((s) => s.active !== false).reduce((acc, s) => ({ persons: acc.persons + s.totalAbsent, hours: acc.hours + s.totalLost }), { persons: 0, hours: 0 }), [stationSummaries]);
  const lossTotal = useMemo(() => stationSummaries.filter((s) => s.active !== false).reduce((acc, s) => acc + (s.lossTotal != null && s.lossTotal > 0 ? s.lossTotal : 0), 0), [stationSummaries]);

  const downtimeSummary = useMemo(() => {
    const stats = {};
    DOWNTIME_REASONS.forEach(r => {
      stats[r.id] = { ...r, hours: 0, count: 0, stations: new Set() };
    });
    let totalDowntimeHours = 0;

    weekDates.forEach((d, i) => {
      data.stations.filter(s => s.active !== false).forEach(s => {
        const e = data.entries[`${dateKey(d)}|${s.id}`];
        if (!e || e.isIdle) return;
        const reasonId = e.downtimeReason;
        if (!reasonId || !stats[reasonId]) return;

        const cInfo = carryoverMap[s.id]?.[i];
        const act = (parseFloat(e.actual) || 0) + (e.hasSecondJob ? (parseFloat(e.secondJobActual) || 0) : 0);
        const std = cInfo ? cInfo.totalStandard : s.standardHours;
        const loss = (std != null && act > std) ? (act - std) : (e.job1Status === 'in_progress' ? (cInfo?.job1Remainder || 0) : 0);
        
        const lossEffective = loss > 0.05 ? loss : 1.0;
        stats[reasonId].hours += lossEffective;
        stats[reasonId].count += 1;
        stats[reasonId].stations.add(s.name);
        totalDowntimeHours += lossEffective;
      });
    });

    const list = Object.values(stats)
      .filter(s => s.count > 0)
      .map(s => ({
        ...s,
        percent: totalDowntimeHours > 0 ? (s.hours / totalDowntimeHours) * 100 : 0,
        stationsList: Array.from(s.stations)
      }))
      .sort((a, b) => b.hours - a.hours);

    return { list, totalDowntimeHours };
  }, [data, weekDates, carryoverMap]);

  const wagonsCatalog = useMemo(() => {
    const map = {};

    weekDates.forEach((d, i) => {
      const dayName = DAY_NAMES[i];
      const dFormatted = `${d.getDate()} ${MONTHS[d.getMonth()]}`;
      const dKey = dateKey(d);

      data.stations.filter(s => s.active !== false).forEach(s => {
        const e = data.entries[`${dKey}|${s.id}`];
        if (!e || e.isIdle) return;
        const cInfo = carryoverMap[s.id]?.[i];

        const timeline = getStationStaffTimeline(dKey, s.id, data.stations, data.entries);
        const currentStaffNow = getStaffAtMinute(nowMin, timeline.baseStaff, timeline.events);
        const isCurrentlyPaused = currentStaffNow === 0 && (timeline.events.length > 0 || timeline.baseStaff === 0);
        const inboundReinforcements = timeline.events.filter(ev => ev.type === 'inbound');

        const w1 = (e.wagonNo || cInfo?.job1WagonNo || '').trim();
        if (w1) {
          if (!map[w1]) {
            map[w1] = {
              wagonNo: w1,

              totalStandard: 0,
              firstDay: dayName,
              latestStatus: 'İşlemde',
              stationsSet: new Set()
            };
          }
          const j1Act = parseFloat(e.actual) || 0;
          const isCarryContinuation = !!(cInfo?.isCarryover && (cInfo?.job1WagonNo === w1));
          const j1Std = isCarryContinuation ? (cInfo.job1Standard) : (s.standardHours);
          const isDone = (e.job1Status !== 'in_progress') && (e.actualEndTime != null);
          const j1StatusText = e.job1Status === 'in_progress' ? 'Devam Ediyor' : (isDone ? 'Tamamlandı' : 'Başlandı');
          
          const startMin1 = timeToMin(e.startTime) ?? SHIFT_START_MIN;
          const est1 = estimateDynamicFinishTime(startMin1, j1Std, timeline.baseStaff, timeline.events, e.overtimeDecision, i);
          const finishMin1 = est1 ? est1.finishMin : (timeToMin(e.actualEndTime) || SHIFT_END_MIN);

          const dyn = calcDynamicSegmentsActual(startMin1, timeToMin(e.actualEndTime) || finishMin1, timeline.baseStaff, timeline.events);

          map[w1].steps.push({
            day: dayName,
            dateStr: dFormatted,
            stationId: s.id,
            stationName: s.name,
            group: s.group,
            jobName: isCarryContinuation ? '1. İş (Devir Tamamlama)' : '1. İş',
            standard: j1Std,
            actual: j1Act,
            startMin: startMin1,

            startTime: e.startTime,
            endTime: e.actualEndTime,
            status: j1StatusText,
            isDone,

            segments: dyn.segments,
            actualProgress: e.actualProgress != null && e.actualProgress !== '' ? parseFloat(e.actualProgress) : null,

          if (!isCarryContinuation && s.standardHours != null) {

            const isDone2 = (e.secondJobStatus !== 'in_progress') && (e.secondJobActualEndTime != null);
            const j2StatusText = e.secondJobStatus === 'in_progress' ? 'Devam Ediyor' : (isDone2 ? 'Tamamlandı' : 'Başlandı');

            const startMin2 = timeToMin(e.secondJobStartTime) ?? (timeToMin(e.actualEndTime) || SHIFT_START_MIN);
            const est2 = estimateDynamicFinishTime(startMin2, j2Std, timeline.baseStaff, [], e.overtimeDecision, i);
            const finishMin2 = est2 ? est2.finishMin : (timeToMin(e.secondJobActualEndTime) || SHIFT_END_MIN);

            map[w2].totalActual += j2Act;

            map[w2].latestStatus = j2StatusText;
            map[w2].stationsSet.add(s.name);
          }
        }
      });
    });

    return Object.values(map).map(w => {
      const overallEff = calcEff(w.totalActual, w.totalStandard);
      const lastStep = w.steps[w.steps.length - 1];

      const lastWithActual = [...w.steps].reverse().find(st => st.actualProgress != null);

  const filteredWagons = useMemo(() => {

      .sort((a, b) => b.avg - a.avg)
      .slice(0, 3);

  function printReport() {
    const rangeLabel = formatRange(weekStart);
    const rows = stationSummaries.filter(s => s.active !== false).map((s) => {
      let wagonSummaryHtml = '—';
      if (s.wagonsList && s.wagonsList.length > 0) {

          </div>`;
        }).join('');
      }
      return `
      <tr>
        <td>
          <div style="font-weight:700;font-size:13px">${s.name}</div>
          <span style="color:#64748B;font-size:11.5px">(${getGroupIcon(s.group)} ${GROUP_LABEL[s.group]})</span>
        </td>
        <td style="min-width:160px">${wagonSummaryHtml}</td>
        <td style="text-align:right">${s.totalStandardExpected > 0 ? s.totalStandardExpected.toFixed(1) : (s.standardHours != null ? s.standardHours.toFixed(1) : '—')}</td>
        <td style="text-align:right;font-weight:600">${s.totalActual.toFixed(1)}</td>
        <td style="text-align:right;font-weight:700;color:${s.lossTotal != null && s.lossTotal > 0.05 ? '#e11d48' : '#059669'}">${s.lossTotal == null ? '—' : (s.lossTotal > 0.05 ? '+' + s.lossTotal.toFixed(1) + ' (kayıp)' : (s.lossTotal < -0.05 ? (-s.lossTotal).toFixed(1) + ' (tasarruf)' : '0.0'))}</td>
        <td style="text-align:right">${s.totalAbsent > 0 ? s.totalAbsent + ' kişi / ' + s.totalLost.toFixed(1) + ' a-s' : '—'}</td>
        <td style="text-align:right;font-weight:800">${s.avg === null ? (s.idleDays > 0 ? '<span style="color:#64748B">Planlı Boşta</span>' : '—') : Math.round(s.avg) + '%'}</td>
      </tr>`;
    }).join('');

    const wagonBreakdownRows = wagonsCatalog.map(w => {
      let taslamaAct = 0, montajAct = 0, kaynakAct = 0;
      w.steps.forEach(st => {

      });

      const eff = calcEff(totAct, w.totalStandard);
      const isDone = w.latestStatus === 'Tamamlandı';
      const badgeColor = isDone ? '#059669' : '#d97706';
      const badgeIcon = isDone ? '✓' : '⏳';

      return `<tr>
        <td style="font-weight:700;color:#0284c7;font-size:13px">🚆 #${w.wagonNo}</td>
        <td style="font-size:11.5px;color:#334155">${w.stationsList.join(' → ') || '—'}</td>

  function exportCSV() {
    const header = ['Tarih', 'İstasyon', 'Grup', 'Durum', '1. İş Vagon No', '1. İş Durumu', '1. İş Başlangıç', '1. İş Bitiş', '1. İş Standart (a-s)', '1. İş Gerçekleşen (a-s)', '2. İş Vagon No', '2. İş Durumu', '2. İş Başlangıç', '2. İş Bitiş', '2. İş Standart (a-s)', '2. İş Gerçekleşen (a-s)', 'Toplam Standart', 'Toplam Gerçekleşen', 'Personel', 'Devamsız', 'Personel Transfer Detayı', 'Duruş Nedeni', 'Verim (%)'];
    const lines = [header.join(';')];
    weekDates.forEach((d) => {
      const dKey = dateKey(d);
      data.stations.filter(s => s.active !== false).forEach((s) => {
        const e = data.entries[`${dKey}|${s.id}`];
        if (!hasAnyInput(e)) return;
        if (e.isIdle) {
          lines.push([dKey, s.name, GROUP_LABEL[s.group], 'Planlı Boşta', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', ''].join(';'));
          return;
        }
        const cDay = carryoverMap[s.id]?.find((_, idx) => weekDates[idx].getTime() === d.getTime());
        const act = (parseFloat(e.actual) || 0) + (e.hasSecondJob ? (parseFloat(e.secondJobActual) || 0) : 0);
        const std = cDay ? cDay.totalStandard : s.standardHours;
        const eff = calcEff(act, std);

        const w1 = (e.wagonNo || cDay?.job1WagonNo || '').trim();
        const j1Status = e.job1Status === 'in_progress' ? 'Devam Ediyor' : (e.actualEndTime ? 'Tamamlandı' : 'Başlandı');
        const w2 = e.hasSecondJob ? ((e.secondJobWagonNo || w1).trim()) : '';
        const j2Status = e.hasSecondJob ? (e.secondJobStatus === 'in_progress' ? 'Devam Ediyor' : (e.secondJobActualEndTime ? 'Tamamlandı' : 'Başlandı')) : '';
        const dt = getDowntimeInfo(e.downtimeReason);

        const timeline = getStationStaffTimeline(dKey, s.id, data.stations, data.entries);
        const transfersInfo = timeline.events.map(ev => `${ev.timeStr} -> ${ev.type === 'inbound' ? '+' : '-'}${ev.count}k (${ev.type === 'inbound' ? ev.fromStationName + ' takviyesi' : ev.targetStationName} Vagon: ${ev.wagonNo})`).join(' | ');

        lines.push([
          dKey, 
          s.name, 
          GROUP_LABEL[s.group] || s.group, 
          'Çalışıyor', 
          w1,
          j1Status,
          e.startTime || '', 
          e.actualEndTime || '', 
          cDay ? cDay.job1Standard : '', 
          e.actual || '', 
          w2,
          j2Status,
          e.hasSecondJob ? e.secondJobStartTime : '', 
          e.hasSecondJob ? e.secondJobActualEndTime : '', 
          e.hasSecondJob ? e.secondJobStandard : '', 
          e.hasSecondJob ? e.secondJobActual : '',
          std ?? '',
          act > 0 ? act.toFixed(1) : '',
          e.totalStaff || '', 
          e.absentStaff || '', 
          transfersInfo,
          dt ? dt.short : '',
          eff === null ? '' : Math.round(eff)
        ].join(';'));
      });
    });
    const csv = '\uFEFF' + lines.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `istasyon-verim-vagon-${dateKey(weekStart)}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

                <div style={{ fontSize: 14.5, fontWeight: 800, color: C.paper, marginBottom: 16 }}>🏆 Haftanın En Yüksek Verimli İstasyonları</div>
                
                {topStations.length === 0 ? (
                  <div style={{ padding: '24px 0', textAlign: 'center', color: C.dim, fontSize: 13 }}>Bu hafta için henüz verim verisi bulunmuyor.</div>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                    {topStations.map((s, idx) => {
                      const medal = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : '🥉');
                      return (
                        <div key={s.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 14px', background: C.panelAlt, border: `1px solid ${C.border}`, borderRadius: 8 }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                            <span style={{ fontSize: 22 }}>{medal}</span>
                            <div>
                              <div style={{ fontWeight: 700, fontSize: 14, color: C.paper }}>{s.name}</div>
                              <GroupTag group={s.group} />
                            </div>
                          </div>
                          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 18, fontWeight: 800, color: effColor(s.avg, C) }}>
                            {Math.round(s.avg)}%
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          </div>
        )}

        <div style={{ marginTop: 32, fontSize: 12.5, color: C.dim, textAlign: 'center' }}>
          Epsilon Solentek İstasyon Verim Panosu · Firebase Cloud Veritabanı
        </div>
      </div>
    </div>
  );
}

function Root() {
  const [authState, setAuthState] = useState('loading');
  const [currentUser, setCurrentUser] = useState(null);
  const [themeMode, setThemeMode] = useState(() => {
    return localStorage.getItem('est_app_theme') || 'light';
  });

  const toggleTheme = () => {
    setThemeMode((prev) => {
      const next = prev === 'light' ? 'dark' : 'light';
      localStorage.setItem('est_app_theme', next);
      return next;
    });
  };

  const C = THEMES[themeMode] || THEMES.light;

  useEffect(() => {
    document.body.setAttribute('data-theme', themeMode);
    document.body.style.backgroundColor = C.page;
    document.body.style.color = C.paper;
  }, [themeMode, C.page, C.paper]);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged((user) => {
      setCurrentUser(user);
      setAuthState(user ? 'signed-in' : 'signed-out');
    });
    return unsub;
  }, []);

  const contextValue = useMemo(() => ({
    theme: themeMode,
    toggleTheme,
    C
  }), [themeMode, C]);

  if (authState === 'loading') {
    return (
      <div style={{ minHeight: '100vh', background: C.page, display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.dim, fontFamily: "'Plus Jakarta Sans', sans-serif" }}>
        Yükleniyor…
      </div>
    );
  }

  return (
    <ThemeContext.Provider value={contextValue}>
      {authState === 'signed-out' ? (
        <LoginScreen />
      ) : (
        <App currentUser={currentUser} onLogout={() => auth.signOut()} />
      )}
    </ThemeContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
