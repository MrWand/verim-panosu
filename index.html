            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <div style={{ width: 7, height: 7, borderRadius: 4, background: connected ? C.good : C.bad, boxShadow: `0 0 8px ${connected ? C.good : C.bad}` }} />
              <span style={{ fontSize: 10, color: C.dim, fontFamily: "'JetBrains Mono', monospace" }}>{connected ? 'Ortak pano bağlı' : 'Bağlantı yok'}</span>
            </div>
          </div>
        </div>

        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8, marginBottom: 20, fontSize: 11, fontFamily: "'JetBrains Mono', monospace", color: C.dim }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap' }}>
            <span>Giriş yapan: <span style={{ color: C.paper }}>{username}</span></span>
            {lastEdit && (
              <span>Son değişiklik: <span style={{ color: C.copper }}>{lastEdit.username}</span> · {new Date(lastEdit.timestamp).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</span>
            )}
          </div>
          <button onClick={() => auth.signOut()} style={{ background: 'none', border: `1px solid ${C.border}`, color: C.dim, padding: '4px 12px', fontSize: 11, cursor: 'pointer', fontFamily: "'JetBrains Mono', monospace" }}>Çıkış Yap</button>
        </div>

        {/* Istasyon yonetimi */}
        <div style={{ marginBottom: 20 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: 1.5, color: C.line, textTransform: 'uppercase' }}>
              İstasyonlar ve Standart Adam-Saat
            </div>
            <button 
              onClick={() => setShowInactiveStations(!showInactiveStations)} 
              style={{ background: 'transparent', border: `1px solid ${C.border}`, color: showInactiveStations ? C.good : C.dim, fontSize: 11, padding: '3px 8px', cursor: 'pointer', fontFamily: "'JetBrains Mono', monospace" }}>
              {showInactiveStations ? '✓ Pasif İstasyonlar Gösteriliyor' : '+ Pasif İstasyonları Göster'}
            </button>
          </div>
          <div style={{ background: C.panel, border: `1px solid ${C.border}`, padding: 14 }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 12 }}>
              {displayedStations.map((s) => (
                <div key={s.id} style={{ display: 'flex', alignItems: 'center', gap: 8, background: s.active === false ? 'rgba(5,8,13,0.85)' : C.panelAlt, border: `1px solid ${s.active === false ? 'rgba(108,138,160,0.3)' : C.border}`, padding: '6px 10px', opacity: s.active === false ? 0.65 : 1 }}>
                  <GroupTag group={s.group} />
                  <span style={{ flex: 1, fontSize: 13, color: s.active === false ? C.dim : C.paper }}>
                    {s.name} {s.active === false && <span style={{ fontSize: 10, color: C.bad }}>(Pasif)</span>}
                  </span>
                  <input
                    type="number" min="0" step="0.5" placeholder="a-s"
                    className="num-input num-input-sm" style={{ width: 70 }}
                    value={s.standardHours ?? ''}
                    onChange={(e) => updateStationField(s.id, 'standardHours', e.target.value === '' ? null : parseFloat(e.target.value))}
                  />
                  <button 
                    onClick={() => toggleStationActive(s.id, s.active !== false)} 
                    style={{ background: s.active === false ? C.bad + '22' : C.good + '22', border: `1px solid ${s.active === false ? C.bad : C.good}`, color: s.active === false ? C.bad : C.good, cursor: 'pointer', padding: '3px 8px', fontSize: 11, borderRadius: 2 }}
                    title={s.active === false ? 'İstasyonu Aktif Yap' : 'İstasyonu Pasife Al'}>
                    {s.active === false ? 'Pasif' : 'Aktif'}
                  </button>
                  <button onClick={() => removeStation(s.id)} style={{ background: 'none', border: 'none', color: C.dim, cursor: 'pointer', padding: 2, fontSize: 16 }} title="Tamamen Sil">×</button>
                </div>
              ))}
            </div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              <input value={newStation} onChange={(e) => setNewStation(e.target.value)} placeholder="Yeni istasyon adı" style={{ flex: 2, minWidth: 160, background: C.page, border: `1px solid ${C.border}`, color: C.paper, padding: '8px 10px', fontSize: 13 }} />
              <div style={{ display: 'flex', gap: 4 }}>
                <button onClick={() => setNewGroup('taslama')} style={{ fontSize: 11, padding: '0 10px', cursor: 'pointer', background: newGroup === 'taslama' ? C.border : 'transparent', border: `1px solid ${C.border}`, color: C.paper }}>Taşlama</button>
                <button onClick={() => setNewGroup('kaynakmontaj')} style={{ fontSize: 11, padding: '0 10px', cursor: 'pointer', background: newGroup === 'kaynakmontaj' ? C.border : 'transparent', border: `1px solid ${C.border}`, color: C.paper }}>Kaynak-Montaj</button>
              </div>
              <input type="number" min="0" step="0.5" placeholder="Standart a-s" className="num-input" style={{ width: 110 }} value={newStandard} onChange={(e) => setNewStandard(e.target.value)} />
              <button onClick={addStation} style={{ background: C.copper, border: 'none', color: '#2A1A08', padding: '0 18px', cursor: 'pointer', fontWeight: 700, fontSize: 14, fontFamily: "'Rajdhani', sans-serif", boxShadow: `0 0 16px ${C.copper}55` }}>Ekle</button>
            </div>
          </div>
        </div>

        {/* Gun sekmeleri */}
        <div style={{ display: 'flex', gap: 4, marginBottom: 0, borderBottom: `1px solid ${C.border}` }}>
          {weekDates.map((d, i) => {
            const active = i === dayIndex;
            const hasData = hasDataForDate(d);
            return (
              <button key={i} onClick={() => setDayIndex(i)} style={{ flex: 1, background: active ? C.panel : 'transparent', border: `1px solid ${active ? C.border : 'transparent'}`, borderBottom: active ? `1px solid ${C.panel}` : `1px solid transparent`, boxShadow: active ? '0 0 14px rgba(0,229,255,0.18)' : 'none', marginBottom: -1, padding: '8px 2px', cursor: 'pointer', color: active ? C.paper : C.dim, position: 'relative' }}>
                <div style={{ fontSize: 11, fontWeight: 600, fontFamily: "'Rajdhani', sans-serif", letterSpacing: 0.5 }}>{DAY_NAMES[i]}</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, fontWeight: 600 }}>{d.getDate()}</div>
                {hasData && <div style={{ position: 'absolute', top: 4, right: 4, width: 4, height: 4, borderRadius: 2, background: C.good }} />}
              </button>
            );
          })}
        </div>

        {/* Secili gunun istasyon girisleri */}
        <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderTop: 'none', padding: 16, marginBottom: 24 }}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(340px, 1fr))', gap: 12 }}>
            {data.stations.filter(s => s.active !== false).map((s) => {
              const entry = data.entries[`${selectedKey}|${s.id}`] || {};
              const isIdle = !!entry.isIdle;
              const cDay = carryoverMap[s.id]?.[dayIndex];
              
              const totalActual = (parseFloat(entry.actual) || 0) + (entry.hasSecondJob ? (parseFloat(entry.secondJobActual) || 0) : 0);
              const totalStandard = cDay ? cDay.totalStandard : s.standardHours;
              const eff = calcEff(totalActual, totalStandard);
              const color = effColor(eff);
              
              const totalStaff = parseFloat(entry.totalStaff) || 0;
              const absentStaff = parseFloat(entry.absentStaff) || 0;
              const presentStaff = Math.max(totalStaff - absentStaff, 0);
              const lostHours = absentStaff * shiftHours;
              
              const lossHours = (totalStandard != null && totalActual > 0) ? totalActual - totalStandard : null;
              const lossPercent = (lossHours != null && totalStandard > 0) ? (lossHours / totalStandard) * 100 : null;
              const showStatus = hasAnyInput(entry) && !isIdle;
              
              const isFinalStage = FINAL_STAGES.includes(s.name);
              const cascadeInfo = isFinalStage ? finalCascade.find((c) => c && c.station.id === s.id) : null;
              
              let displayInfo = cascadeInfo;
              if (!isFinalStage && !isIdle) {
                const explicitStart = timeToMin(entry.startTime);
                const startMinGeneric = explicitStart != null ? explicitStart : SHIFT_START_MIN;
                const neededMinGeneric = stageRequiredMinutes(totalStandard, presentStaff, allowancePercent);
                if (neededMinGeneric != null) {
                  const est = estimateWithDecision(startMinGeneric, neededMinGeneric, entry.overtimeDecision);
                  displayInfo = { startMin: startMinGeneric, finishMin: est.finishMin, mode: est.mode, overMinutes: est.overMinutes || 0, needsDecision: est.needsDecision, autoStart: explicitStart == null };
                } else {
                  displayInfo = null;
                }
              }

              return (
                <div key={s.id} className={isIdle ? 'idle-card' : ''} style={{ background: C.panelAlt, border: `1px solid ${C.border}`, padding: 14, transition: 'all 0.3s ease' }}>
                  
                  {/* Kart Basligi */}
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                    <span style={{ fontWeight: 600, fontSize: 14, fontFamily: "'Rajdhani', sans-serif", letterSpacing: 0.3 }}>{s.name}</span>
                    
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <button
                        onClick={() => toggleDayIdle(selectedKey, s.id)}
                        style={{
                          background: isIdle ? '#FFA640' : 'transparent',
                          color: isIdle ? '#2A1A08' : C.dim,
                          border: `1px solid ${isIdle ? '#FFA640' : C.border}`,
                          fontSize: 10,
                          padding: '2px 8px',
                          borderRadius: 2,
                          cursor: 'pointer',
                          fontWeight: 600
                        }}
                      >
                        {isIdle ? '⏸️ Bugün Boşta / İş Yok' : 'Çalışıyor'}
                      </button>
                      {!isIdle && (
                        <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 14, fontWeight: 700, color }}>
                          {eff === null ? '—' : `${Math.round(eff)}%`}
                        </span>
                      )}
                    </div>
                  </div>

                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8, flexWrap: 'wrap' }}>
                    <GroupTag group={s.group} />
                    <span style={{ fontSize: 11, color: C.dim, fontFamily: "'JetBrains Mono', monospace" }}>
                      {s.standardHours != null ? `Temel Standart: ${s.standardHours} a-s` : 'Standart belirlenmedi'}
                    </span>
                  </div>

                  {isIdle ? (
                    <div style={{ padding: '16px 10px', textAlign: 'center', background: C.page, border: `1px dashed ${C.border}`, borderRadius: 3, marginTop: 10 }}>
                      <div style={{ fontSize: 12, color: C.copper, fontWeight: 600, marginBottom: 4 }}>İstasyon Bugün Planlı Olarak Boşta</div>
                      <div style={{ fontSize: 10.5, color: C.dim }}>Verim, devamsızlık ve rapor ortalamalarını olumsuz etkilemez.</div>
                    </div>
                  ) : (
                    <>
                      {/* Personel Girisi */}
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 10, background: C.page, padding: 8, borderRadius: 3, border: `1px solid ${C.border}44` }}>
                        <div>
                          <div style={{ fontSize: 10, color: C.dim, marginBottom: 3, textAlign: 'center' }}>Mevcut personel</div>
                          <input type="number" min="0" step="1" className="num-input num-input-sm" placeholder="0" value={entry.totalStaff || ''} onChange={(e) => updateEntry(selectedKey, s.id, 'totalStaff', e.target.value)} />
                        </div>
                        <div>
                          <div style={{ fontSize: 10, color: C.dim, marginBottom: 3, textAlign: 'center' }}>Devamsız personel</div>
                          <input type="number" min="0" step="1" className="num-input num-input-sm" placeholder="0" value={entry.absentStaff || ''} onChange={(e) => updateEntry(selectedKey, s.id, 'absentStaff', e.target.value)} />
                        </div>
                        {absentStaff > 0 && (
                          <div style={{ gridColumn: '1 / -1', fontSize: 10.5, color: C.bad, textAlign: 'center', fontFamily: "'JetBrains Mono', monospace" }}>
                            Devamsızlık kaybı: {lostHours.toFixed(1)} a-s
                          </div>
                        )}
                      </div>

                      {/* 1. İŞ (DÜNDEN DEVREDEN VEYA İLK İŞ) */}
                      <div style={{ background: C.page, border: `1px solid ${C.border}`, borderRadius: 3, padding: '10px 10px', marginBottom: 10 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                          <span style={{ fontSize: 12, fontFamily: "'JetBrains Mono', monospace", color: cDay?.isCarryover ? C.copper : C.line, fontWeight: 700 }}>
                            {cDay?.isCarryover ? `↷ 1. İŞ: DÜNDEN KALAN (${cDay.job1Standard.toFixed(1)} a-s)` : `1. İŞ: STANDART (${s.standardHours != null ? `${s.standardHours} a-s` : '—'})`}
                          </span>
                          {cDay?.job1Completed != null && (
                            <span style={{ fontSize: 11, fontFamily: "'JetBrains Mono', monospace", color: cDay.job1Completed >= 100 ? C.good : C.copper, fontWeight: 600 }}>
                              %{Math.round(cDay.job1Completed)} bitti
                            </span>
                          )}
                        </div>

                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 6, marginBottom: 4 }}>
                          <div>
                            <div style={{ fontSize: 9.5, color: C.dim, marginBottom: 3, textAlign: 'center' }}>Başlama</div>
                            <input type="time" className="num-input num-input-sm" value={entry.startTime || ''} placeholder="06:55" onChange={(e) => updateEntry(selectedKey, s.id, 'startTime', e.target.value)} />
                          </div>
                          <div>
                            <div style={{ fontSize: 9.5, color: C.dim, marginBottom: 3, textAlign: 'center' }}>Gerçek Bitiş</div>
                            <input type="time" className="num-input num-input-sm" value={entry.actualEndTime || ''} onChange={(e) => updateEntry(selectedKey, s.id, 'actualEndTime', e.target.value)} />
                          </div>
                          <div>
                            <div style={{ fontSize: 9.5, color: C.dim, marginBottom: 3, textAlign: 'center' }}>Harcanan</div>
                            <div style={{ background: 'rgba(3,8,14,0.9)', border: `1px solid ${C.border}`, borderRadius: 3, padding: '6px 4px', textAlign: 'center', fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: C.paper, fontWeight: 700 }}>
                              {entry.actual ? `${parseFloat(entry.actual).toFixed(1)} a-s` : '—'}
                            </div>
                          </div>
                        </div>

                        {cDay?.job1Remainder > 0.05 && (
                          <div style={{ fontSize: 10.5, color: C.bad, fontFamily: "'JetBrains Mono', monospace", marginTop: 4 }}>
                            ⚠ 1. İşten kalan: {cDay.job1Remainder.toFixed(1)} a-s
                          </div>
                        )}
                      </div>

                      {/* 2. İŞ BAŞLATMA BUTONU / ALANI */}
                      {!entry.hasSecondJob ? (
                        <button
                          type="button"
                          onClick={() => toggleSecondJob(selectedKey, s.id, entry.actualEndTime, s.standardHours)}
                          style={{
                            width: '100%',
                            background: 'rgba(57, 255, 158, 0.10)',
                            border: '1px dashed #39FF9E',
                            color: '#39FF9E',
                            padding: '10px 8px',
                            borderRadius: 4,
                            cursor: 'pointer',
                            fontFamily: "'Rajdhani', sans-serif",
                            fontWeight: 700,
                            fontSize: 13,
                            letterSpacing: 0.5,
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            gap: 8,
                            marginBottom: 10,
                            boxShadow: '0 0 12px rgba(57, 255, 158, 0.12)',
                            transition: 'all 0.2s ease'
                          }}
                        >
                          <span style={{ fontSize: 15 }}>➕</span>
                          GÜN İÇİNDE 2. YENİ İŞİ BAŞLAT
                        </button>
                      ) : (
                        /* 2. İŞ AÇILDIĞINDA GÖRÜNEN DETAY KUTUSU */
                        <div style={{ background: 'rgba(8, 15, 24, 0.95)', border: '1px solid #FFA640', borderRadius: 4, padding: '10px', marginBottom: 10, boxShadow: '0 0 16px rgba(255, 166, 64, 0.15)' }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8, borderBottom: '1px solid rgba(255, 166, 64, 0.3)', paddingBottom: 6 }}>
                            <span style={{ fontSize: 12, color: '#FFA640', fontFamily: "'Rajdhani', sans-serif", fontWeight: 700, letterSpacing: 0.5 }}>
                              ⚡ 2. İŞ (GÜN İÇİNDE BAŞLAYAN YENİ İŞ)
                            </span>
                            <button
                              type="button"
                              onClick={() => toggleSecondJob(selectedKey, s.id, entry.actualEndTime, s.standardHours)}
                              style={{
                                background: 'rgba(255, 84, 104, 0.2)',
                                border: '1px solid #FF5468',
                                color: '#FF5468',
                                fontSize: 11,
                                padding: '2px 8px',
                                cursor: 'pointer',
                                borderRadius: 2,
                                fontWeight: 600
                              }}
                            >
                              ✕ İptal Et / Kaldır
                            </button>
                          </div>

                          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
                            <span style={{ fontSize: 11, color: C.dim }}>Yeni İşin Standart Süresi:</span>
                            <input
                              type="number" min="0" step="0.5" placeholder="a-s"
                              className="num-input num-input-sm" style={{ width: 75, padding: '3px 6px' }}
                              value={entry.secondJobStandard || ''}
                              onChange={(e) => updateEntry(selectedKey, s.id, 'secondJobStandard', e.target.value)}
                            />
                            <span style={{ fontSize: 11, color: C.dim }}>adam-saat</span>
                          </div>

                          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 6, marginBottom: 4 }}>
                            <div>
                              <div style={{ fontSize: 9.5, color: C.dim, marginBottom: 3, textAlign: 'center' }}>2. İş Başlama</div>
                              <input type="time" className="num-input num-input-sm" value={entry.secondJobStartTime || ''} placeholder={entry.actualEndTime || '12:50'} onChange={(e) => updateEntry(selectedKey, s.id, 'secondJobStartTime', e.target.value)} />
                            </div>
                            <div>
                              <div style={{ fontSize: 9.5, color: C.dim, marginBottom: 3, textAlign: 'center' }}>2. İş Bitiş</div>
                              <input type="time" className="num-input num-input-sm" value={entry.secondJobActualEndTime || ''} placeholder="16:55" onChange={(e) => updateEntry(selectedKey, s.id, 'secondJobActualEndTime', e.target.value)} />
                            </div>
                            <div>
                              <div style={{ fontSize: 9.5, color: C.dim, marginBottom: 3, textAlign: 'center' }}>2. İş Harcanan</div>
                              <div style={{ background: 'rgba(3,8,14,0.9)', border: '1px solid #FFA640', borderRadius: 3, padding: '6px 4px', textAlign: 'center', fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: '#FFA640', fontWeight: 700 }}>
                                {entry.secondJobActual ? `${parseFloat(entry.secondJobActual).toFixed(1)} a-s` : '—'}
                              </div>
                            </div>
                          </div>

                          {cDay?.job2Remainder > 0.05 && (
                            <div style={{ fontSize: 11, color: C.copper, fontFamily: "'JetBrains Mono', monospace", marginTop: 6, fontWeight: 600 }}>
                              ↷ 2. İşten yarına devredecek: {cDay.job2Remainder.toFixed(1)} a-s
                            </div>
                          )}
                        </div>
                      )}

                      {/* Gunluk Toplam Ozet & Verim Barı */}
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8, padding: '6px 10px', background: 'rgba(0,229,255,0.06)', border: `1px solid ${C.border}44`, borderRadius: 3 }}>
                        <span style={{ fontSize: 11, color: C.line, fontFamily: "'JetBrains Mono', monospace" }}>Günün Toplam Gerçekleşeni:</span>
                        <span style={{ fontSize: 13, fontWeight: 700, color: C.paper, fontFamily: "'JetBrains Mono', monospace" }}>
                          {totalActual > 0 ? `${totalActual.toFixed(1)} a-s` : '—'}
                        </span>
                      </div>

                      {displayInfo?.needsDecision && (
                        <div style={{ marginBottom: 10 }}>
                          <div style={{ fontSize: 10.5, color: C.copper, marginBottom: 5, fontFamily: "'JetBrains Mono', monospace" }}>⚠ Bu iş normal mesaide (16:55) bitmiyor — mesai yapılacak mı?</div>
                          <div style={{ display: 'flex', gap: 6 }}>
                            <button
                              onClick={() => updateEntry(selectedKey, s.id, 'overtimeDecision', 'yes')}
                              style={{ flex: 1, fontSize: 11, fontWeight: 600, padding: '7px 0', cursor: 'pointer', background: 'transparent', border: `1px solid ${C.copper}`, color: C.copper }}
                            >
                              Mesai Yapılacak
                            </button>
                            <button
                              onClick={() => updateEntry(selectedKey, s.id, 'overtimeDecision', 'no')}
                              style={{ flex: 1, fontSize: 11, fontWeight: 600, padding: '7px 0', cursor: 'pointer', background: 'transparent', border: `1px solid ${C.bad}`, color: C.bad }}
                            >
                              Mesai Yapılmayacak
                            </button>
                          </div>
                        </div>
                      )}

                      <DimensionBar eff={eff} />

                      {showStatus && (
                        <div style={{ marginTop: 8, fontSize: 11.5, fontFamily: "'JetBrains Mono', monospace", display: 'flex', flexDirection: 'column', gap: 3 }}>
                          {totalStandard == null ? (
                            <span style={{ color: C.dim }}>Standart girilmedi — verim hesaplanamıyor</span>
                          ) : lossHours == null ? (
                            <span style={{ color: C.dim }}>Gerçekleşen adam-saat girilmedi</span>
                          ) : lossHours > 0.05 ? (
                            <span style={{ color: C.bad }}>Kayıp: {lossHours.toFixed(1)} a-s (standardın üzerinde)</span>
                          ) : lossHours < -0.05 ? (
                            <span style={{ color: C.good }}>Tasarruf: {(-lossHours).toFixed(1)} a-s (standardın altında)</span>
                          ) : (
                            <span style={{ color: C.good }}>Tam zamanında tamamlandı</span>
                          )}
                          {lossPercent != null && lossPercent > allowancePercent && (
                            <span style={{ color: C.bad }}>⚠ Kayıp oranı %{lossPercent.toFixed(0)} — izin verilen %{allowancePercent} mola payını aşıyor</span>
                          )}
                        </div>
                      )}

                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.border}` }}>
                        <div>
                          <div style={{ fontSize: 9, color: C.dim, marginBottom: 4, textAlign: 'center' }}>Hedef adet (ops.)</div>
                          <input type="number" min="0" className="num-input num-input-sm" placeholder="—" value={entry.target || ''} onChange={(e) => updateEntry(selectedKey, s.id, 'target', e.target.value)} />
                        </div>
                        <div>
                          <div style={{ fontSize: 9, color: C.dim, marginBottom: 4, textAlign: 'center' }}>Üretilen adet (ops.)</div>
                          <input type="number" min="0" className="num-input num-input-sm" placeholder="—" value={entry.produced || ''} onChange={(e) => updateEntry(selectedKey, s.id, 'produced', e.target.value)} />
                        </div>
                      </div>
                    </>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        {/* Final Temizlik teslim tahmini */}
        {finalCascade.some((c) => c) && (
          <div style={{ marginBottom: 24 }}>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: 1.5, color: C.line, textTransform: 'uppercase', marginBottom: 8 }}>
              Final Temizlik — Teslim Tahmini ({DAY_NAMES[dayIndex]} {selectedDate.getDate()} {MONTHS[selectedDate.getMonth()]})
            </div>
            <div style={{ background: C.panel, border: `1px solid ${C.copper}55`, boxShadow: `0 0 24px ${C.copper}18`, padding: 16 }}>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10, marginBottom: 14 }}>
                {finalCascade.map((c, i) => (
                  <React.Fragment key={i}>
                    <div style={{ minWidth: 130, flex: 1 }}>
                      <div style={{ fontSize: 10, color: C.dim, marginBottom: 3, fontFamily: "'JetBrains Mono', monospace" }}>{c ? c.station.name.replace('Final Temizlik - ', '') : FINAL_STAGES[i].replace('Final Temizlik - ', '')}</div>
                      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 15, color: C.paper }}>
                        {c ? minToTime(c.startMin) : '—'} → <span style={{ color: c?.mode === 'exceeds' || c?.mode === 'carryover' ? C.bad : c?.mode === 'overtime' || c?.mode === 'pending' ? C.copper : C.good, fontWeight: 700 }}>{c?.mode === 'carryover' ? '↷ yarına' : c && c.finishMin != null ? minToTime(c.finishMin) : '—'}</span>
                      </div>
                      {c?.mode === 'pending' && <div style={{ fontSize: 9.5, color: C.copper, marginTop: 2 }}>mesai kararı bekleniyor</div>}
                      {c?.mode === 'overtime' && <div style={{ fontSize: 9.5, color: C.copper, marginTop: 2 }}>ek mesai gerekir</div>}
                      {c?.mode === 'exceeds' && <div style={{ fontSize: 9.5, color: C.bad, marginTop: 2 }}>ek mesaide de bitmez</div>}
                      {c?.mode === 'carryover' && <div style={{ fontSize: 9.5, color: C.bad, marginTop: 2 }}>yarına devrediyor</div>}
                    </div>
                    {i < FINAL_STAGES.length - 1 && <div style={{ display: 'flex', alignItems: 'center', color: C.dim, fontSize: 16 }}>→</div>}
                  </React.Fragment>
                ))}
              </div>
              <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 12, display: 'flex', alignItems: 'baseline', gap: 10, flexWrap: 'wrap' }}>
                <span style={{ fontSize: 11, color: C.dim, fontFamily: "'JetBrains Mono', monospace", textTransform: 'uppercase', letterSpacing: 1 }}>Tahmini Teslim Saati</span>
                {(() => {
                  const last = [...finalCascade].reverse().find((c) => c && c.finishMin != null);
                  const lastColor = last?.mode === 'exceeds' ? C.bad : last?.mode === 'overtime' ? C.copper : C.good;
                  return (
                    <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 30, fontWeight: 700, color: lastColor, textShadow: `0 0 16px ${lastColor}66` }}>
                      {last ? minToTime(last.finishMin) : '—'}
                    </span>
                  );
                })()}
              </div>
            </div>
          </div>
        )}

        {/* Grup toplamlari */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: 10, marginBottom: 24 }}>
          <div style={{ background: C.panel, border: `1px solid ${C.groupA}55`, boxShadow: `0 0 20px ${C.groupA}22`, padding: '14px 16px' }}>
            <GroupTag group="taslama" />
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 26, fontWeight: 700, color: C.groupA, marginTop: 8, textShadow: `0 0 14px ${C.groupA}66` }}>
              {groupTotals.taslama.actual.toFixed(1)} <span style={{ fontSize: 13, color: C.dim, fontWeight: 500 }}>a-s</span>
            </div>
            <div style={{ fontSize: 11, color: C.dim, marginTop: 2 }}>
              {groupTotals.taslama.standard > 0 ? `Standart: ${groupTotals.taslama.standard.toFixed(1)} a-s (İlk Temizlik + Sıfırlama + Final Temizlik)` : 'Taşlama istasyonları toplamı'}
            </div>
          </div>
          <div style={{ background: C.panel, border: `1px solid ${C.groupB}55`, boxShadow: `0 0 20px ${C.groupB}22`, padding: '14px 16px' }}>
            <GroupTag group="kaynakmontaj" />
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 26, fontWeight: 700, color: C.groupB, marginTop: 8, textShadow: `0 0 14px ${C.groupB}66` }}>
              {groupTotals.kaynakmontaj.actual.toFixed(1)} <span style={{ fontSize: 13, color: C.dim, fontWeight: 500 }}>a-s</span>
            </div>
            <div style={{ fontSize: 11, color: C.dim, marginTop: 2 }}>
              {groupTotals.kaynakmontaj.standard > 0 ? `Standart: ${groupTotals.kaynakmontaj.standard.toFixed(1)} a-s` : 'Kaynak-Montaj istasyonları toplamı'}
            </div>
          </div>
          <div style={{ background: C.panel, border: `1px solid ${C.bad}55`, boxShadow: `0 0 20px ${C.bad}22`, padding: '14px 16px' }}>
            <span style={{ fontSize: 10, fontFamily: "'JetBrains Mono', monospace", color: C.bad, border: `1px solid ${C.bad}`, borderRadius: 3, padding: '1px 6px', textTransform: 'uppercase', letterSpacing: 0.5 }}>Devamsızlık</span>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 26, fontWeight: 700, color: C.bad, marginTop: 8, textShadow: `0 0 14px ${C.bad}66` }}>
              {absenteeismTotal.persons} <span style={{ fontSize: 13, color: C.dim, fontWeight: 500 }}>kişi-gün</span>
            </div>
            <div style={{ fontSize: 11, color: C.dim, marginTop: 2 }}>{absenteeismTotal.hours.toFixed(1)} adam-saat kayıp bu hafta</div>
          </div>
          <div style={{ background: C.panel, border: `1px solid ${C.copper}55`, boxShadow: `0 0 20px ${C.copper}22`, padding: '14px 16px' }}>
            <span style={{ fontSize: 10, fontFamily: "'JetBrains Mono', monospace", color: C.copper, border: `1px solid ${C.copper}`, borderRadius: 3, padding: '1px 6px', textTransform: 'uppercase', letterSpacing: 0.5 }}>Verim Kaybı</span>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 26, fontWeight: 700, color: C.copper, marginTop: 8, textShadow: `0 0 14px ${C.copper}66` }}>
              {lossTotal.toFixed(1)} <span style={{ fontSize: 13, color: C.dim, fontWeight: 500 }}>a-s</span>
            </div>
            <div style={{ fontSize: 11, color: C.dim, marginTop: 2 }}>Standardın üzerinde harcanan toplam adam-saat</div>
          </div>
        </div>

        {/* Ek mesai gereken istasyonlar */}
        <div style={{ marginBottom: 24 }}>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: 1.5, color: C.line, textTransform: 'uppercase', marginBottom: 8 }}>
            Ek Mesai Gerekebilecek İstasyonlar
          </div>
          {overtimeStations.length === 0 ? (
            <div style={{ background: C.panel, border: `1px solid ${C.border}`, padding: 14, fontSize: 13, color: C.good }}>
              Bu hafta ek mesai gereken istasyon görünmüyor.
            </div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {overtimeStations.map((s) => (
                <div key={s.id} style={{ background: C.panel, border: `1px solid ${C.bad}`, boxShadow: `0 0 18px ${C.bad}33`, padding: '10px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 6 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <GroupTag group={s.group} />
                    <span style={{ fontWeight: 600, fontFamily: "'Rajdhani', sans-serif" }}>{s.name}</span>
                  </div>
                  <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: C.bad }}>
                    ≈{s.totalCapacityShortfall.toFixed(1)} a-s kapasite açığı{s.avgPresent > 0 ? ` · ≈${(s.totalCapacityShortfall / s.avgPresent).toFixed(1)} saat/kişi` : ''}
                    {s.totalAbsent > 0 ? ` · ${s.totalAbsent} kişi devamsız` : ''}
                  </span>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Haftalik ozet */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10, flexWrap: 'wrap', gap: 8 }}>
          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, letterSpacing: 1.5, color: C.line, textTransform: 'uppercase' }}>Haftalık özet — istasyon bazlı</span>
          <div style={{ display: 'flex', gap: 8 }}>
            <button onClick={printReport} style={{ background: C.panel, border: `1px solid ${C.border}`, color: C.paper, padding: '6px 12px', fontSize: 12, cursor: 'pointer', fontWeight: 600 }}>Yazdır / PDF</button>
            <button onClick={exportCSV} style={{ background: C.panel, border: `1px solid ${C.border}`, color: C.paper, padding: '6px 12px', fontSize: 12, cursor: 'pointer', fontWeight: 600 }}>CSV indir</button>
          </div>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: 10 }}>
          {stationSummaries.map((s, i) => (
            <div key={s.id} style={{ background: C.panel, border: `1px solid ${C.border}`, padding: '12px 14px', opacity: s.active === false ? 0.6 : 1 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 }}>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
                  <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: C.dim }}>{String(i + 1).padStart(2, '0')}</span>
                  <span style={{ fontWeight: 600, fontSize: 14, fontFamily: "'Rajdhani', sans-serif" }}>
                    {s.name} {s.active === false && <span style={{ fontSize: 11, color: C.bad }}>(Pasif)</span>}
                  </span>
                </div>
                <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 16, fontWeight: 700, color: effColor(s.avg), textShadow: `0 0 10px ${effColor(s.avg)}` }}>
                  {s.avg === null ? (s.idleDays > 0 ? 'Boşta' : '—') : `${Math.round(s.avg)}%`}
                </span>
              </div>
              <div style={{ marginBottom: 8 }}><GroupTag group={s.group} /></div>
              <DimensionBar eff={s.avg} height={14} />
              <div style={{ fontSize: 11, color: C.dim, marginTop: 8 }}>
                {s.days > 0 ? `${s.totalActual.toFixed(1)} a-s gerçekleşen${s.totalStandardExpected > 0 ? ` / ${s.totalStandardExpected.toFixed(1)} a-s hedef` : ''} · ${s.days} gün çalışma` : (s.idleDays > 0 ? `${s.idleDays} gün planlı boşta` : 'Bu hafta henüz veri girilmedi')}
              </div>
              {s.lossTotal != null && s.lossTotal > 0.05 && (
                <div style={{ fontSize: 11, color: C.bad, marginTop: 2 }}>Verim kaybı: {s.lossTotal.toFixed(1)} a-s</div>
              )}
              {s.lossTotal != null && s.lossTotal < -0.05 && (
                <div style={{ fontSize: 11, color: C.good, marginTop: 2 }}>Tasarruf: {(-s.lossTotal).toFixed(1)} a-s</div>
              )}
              {s.totalAbsent > 0 && (
                <div style={{ fontSize: 11, color: C.bad, marginTop: 2 }}>{s.totalAbsent} kişi-gün devamsız · {s.totalLost.toFixed(1)} a-s kayıp</div>
              )}
            </div>
          ))}
        </div>

        <div style={{ marginTop: 28, fontSize: 11, color: C.dim, textAlign: 'center' }}>
          Veriler ortak bir bulut panosunda (Firebase) saklanır — bu dosyayı kullanan herkes aynı veriyi görür ve düzenler. Kayıt için internet bağlantısı gerekir.
        </div>
      </div>
    </div>
  );
}

function Root() {
  const [authState, setAuthState] = useState('loading');
  const [currentUser, setCurrentUser] = useState(null);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged((user) => {
      setCurrentUser(user);
      setAuthState(user ? 'signed-in' : 'signed-out');
    });
    return unsub;
  }, []);

  if (authState === 'loading') {
    return (
      <div style={{ minHeight: '100vh', background: '#05080D', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#8FAAC2', fontFamily: "'IBM Plex Sans', sans-serif" }}>
        Yükleniyor…
      </div>
    );
  }
  if (authState === 'signed-out') {
    return <LoginScreen />;
  }
  return <App currentUser={currentUser} onLogout={() => auth.signOut()} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
